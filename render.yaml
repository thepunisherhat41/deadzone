# DEADZONE production infrastructure on Render.
# This Blueprint is intentionally configured with a paid PostgreSQL instance.
# Render's free PostgreSQL expires after 30 days and does not provide backups,
# so it is not suitable for a persistent weekly ranking.

previews:
  generation: off

projects:
  - name: deadzone
    environments:
      - name: production
        permissions:
          protection: enabled
        networking:
          isolation: disabled

        services:
          - type: web
            name: deadzone
            runtime: node
            plan: free
            buildCommand: npm install
            startCommand: npm start
            autoDeployTrigger: commit
            envVars:
              - key: DATABASE_URL
                fromDatabase:
                  name: deadzone-db
                  property: connectionString
              - key: RANKING_SECRET
                generateValue: true

        databases:
          - name: deadzone-db
            plan: basic-256mb
            diskSizeGB: 5
            postgresMajorVersion: "18"
            connectionPool: none
            storageAutoscalingEnabled: false
            # The game uses Render's private network connection string above.
            # Block direct access to PostgreSQL from the public internet.
            ipAllowList: []
