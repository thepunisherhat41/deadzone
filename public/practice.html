<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0a0d14"><title>DEADZONE • Treino Offline</title><style>*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}html,body{width:100%;height:100%;overflow:hidden;background:#070a10;font-family:system-ui,sans-serif}canvas{display:block;touch-action:none}#hud{position:fixed;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;z-index:4;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.pill{background:rgba(8,12,20,.9);border:1px solid rgba(255,255,255,.09);border-radius:12px;padding:8px 10px;color:#eaf3fb;font-weight:900;font-size:12px;box-shadow:0 8px 22px rgba(0,0,0,.32)}#topActions{position:fixed;top:max(10px,env(safe-area-inset-top));right:10px;z-index:7;display:flex;gap:7px}button{border:1px solid rgba(255,255,255,.12);background:linear-gradient(180deg,#232c3c,#0b101a);color:white;font-weight:900;border-radius:12px;padding:10px 12px}#weapon{position:fixed;left:50%;bottom:calc(max(16px,env(safe-area-inset-bottom)) + 150px);transform:translateX(-50%);z-index:5;min-width:170px;text-align:center}#left,#right{position:fixed;bottom:calc(max(18px,env(safe-area-inset-bottom)) + 18px);width:118px;height:118px;border-radius:50%;border:2px solid rgba(255,255,255,.18);background:rgba(255,255,255,.035);z-index:5;touch-action:none}#left{left:22px}#right{right:22px;border-color:rgba(255,59,82,.4);background:rgba(255,59,82,.06)}.knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:linear-gradient(180deg,#f45a70,#bb2038);box-shadow:0 6px 0 #781326,0 9px 22px rgba(0,0,0,.35)}#left .knob{background:linear-gradient(180deg,#dbe6f2,#9da9b7);box-shadow:0 6px 0 #626c79,0 9px 22px rgba(0,0,0,.35)}#title{position:fixed;left:50%;top:20%;transform:translateX(-50%);z-index:3;color:rgba(255,255,255,.09);font-size:min(13vw,74px);font-weight:1000;letter-spacing:4px;pointer-events:none;white-space:nowrap}#help{position:fixed;left:50%;top:calc(max(10px,env(safe-area-inset-top)) + 54px);transform:translateX(-50%);z-index:5;color:#8fa7bf;font-size:10px;font-weight:800;background:rgba(6,9,14,.72);padding:5px 8px;border-radius:999px;pointer-events:none}@media(min-width:900px){#left,#right{opacity:.45}#weapon{bottom:20px}}</style></head><body><canvas id="game"></canvas><div id="title">TREINO OFFLINE</div><div id="hud"><div class="pill" id="stats">❤️ 100 • 💀 0</div><div class="pill" id="bots">🤖 5 bots</div></div><div id="topActions"><button id="back">← ONLINE</button><button id="reset">↻</button></div><div id="help">WASD/mouse no PC • dois analógicos no celular</div><button id="weapon">🩴 Chinelo</button><div id="left"><div class="knob"></div></div><div id="right"><div class="knob"></div></div><script src="/practice.js"></script></body></html>
