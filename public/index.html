<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>DEADZONE</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; -webkit-user-select: none; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0d0d12; font-family: system-ui, sans-serif; }
  #game { display: block; }

  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
           background: radial-gradient(circle at 50% 40%, #2a1520, #0d0d12); z-index: 30; gap: 18px; }
  #start h1 { color: #ff3b52; font-size: 44px; letter-spacing: 4px; font-weight: 900; text-shadow: 0 0 20px rgba(255,59,82,.6), 3px 3px 0 #000; }
  #start p { color: #888; font-size: 13px; margin-top: -12px; }
  #start input { padding: 13px 16px; font-size: 16px; border-radius: 10px; border: 2px solid #333; background: #1a1a22; color: #fff; width: 220px; text-align: center; }
  #start button { padding: 15px 44px; font-size: 20px; border: none; border-radius: 10px; background: #ff3b52; color: #fff; font-weight: 900; letter-spacing: 2px; box-shadow: 0 4px 0 #a01828; }
  #start button:active { transform: translateY(4px); box-shadow: 0 0 0 #a01828; }

  #hud { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; color: #fff; font-size: 13px; z-index: 10; pointer-events: none; }
  #scoreboard, #status { background: rgba(0,0,0,.55); padding: 10px 14px; border-radius: 10px; line-height: 1.6; border: 1px solid #333; }
  #status { text-align: right; }
  #status b { color: #ffd23b; }

  #stick { position: fixed; bottom: 34px; left: 34px; width: 130px; height: 130px; z-index: 10; }
  #stickBase { position: absolute; inset: 0; border-radius: 50%; background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.15); }
  #stickKnob { position: absolute; width: 58px; height: 58px; left: 36px; top: 36px; border-radius: 50%; background: rgba(255,59,82,.55); border: 2px solid rgba(255,255,255,.4); }

  #actions { position: fixed; bottom: 34px; right: 34px; z-index: 10; display: flex; flex-direction: column; gap: 12px; align-items: center; }
  #fire { width: 96px; height: 96px; border-radius: 50%; background: rgba(255,59,82,.85); border: 3px solid rgba(255,255,255,.35); color: #fff; font-size: 30px; box-shadow: 0 4px 0 #a01828; }
  #fire:active { transform: translateY(4px); box-shadow: 0 0 0 #a01828; }
  #topRight { position: fixed; top: 64px; right: 12px; z-index: 10; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
  .iconbtn { padding: 10px 14px; border-radius: 9px; border: 2px solid #444; background: rgba(0,0,0,.6); color: #fff; font-size: 14px; font-weight: bold; }
  #weapons { position: fixed; bottom: 140px; right: 34px; z-index: 10; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: 220px; }
  .wbtn { padding: 8px 11px; border-radius: 9px; border: 2px solid transparent; background: rgba(0,0,0,.5); color: #fff; font-size: 12px; font-weight: bold; }
  .wbtn.active { border-color: #ffd23b; background: rgba(255,210,59,.22); color: #ffd23b; }
  .wbtn.locked { opacity: .4; }

  /* Loja */
  #shop { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.75); z-index: 25; }
  #shopBox { background: #16161f; border: 2px solid #ff3b52; border-radius: 16px; padding: 22px; width: 320px; max-width: 90%; }
  #shopBox h2 { color: #ff3b52; text-align: center; margin-bottom: 4px; letter-spacing: 2px; }
  #shopPts { color: #ffd23b; text-align: center; margin-bottom: 14px; font-weight: bold; }
  .shopItem { display: flex; justify-content: space-between; align-items: center; background: #1e1e28; border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  .shopItem .info { color: #fff; }
  .shopItem .info small { color: #888; display: block; }
  .shopItem button { padding: 8px 14px; border: none; border-radius: 8px; font-weight: bold; }
  .buyBtn { background: #ffd23b; color: #000; }
  .ownedBtn { background: #2e7d4a; color: #fff; }
  .cantBtn { background: #444; color: #999; }
  #shopClose { width: 100%; margin-top: 6px; padding: 12px; background: #ff3b52; color: #fff; border: none; border-radius: 10px; font-weight: 900; }

  /* Chat */
  #chatBox { position: fixed; bottom: 180px; left: 14px; width: 260px; max-width: 55%; z-index: 10; pointer-events: none; }
  #chatMsgs { display: flex; flex-direction: column; gap: 3px; font-size: 12px; }
  #chatMsgs div { background: rgba(0,0,0,.5); padding: 4px 8px; border-radius: 6px; color: #fff; width: fit-content; max-width: 100%; }
  #chatInputWrap { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 26; display: none; gap: 6px; width: 90%; max-width: 400px; }
  #chatInput { flex: 1; padding: 12px; border-radius: 10px; border: 2px solid #444; background: #1a1a22; color: #fff; font-size: 15px; }
  #chatSend { padding: 12px 18px; border: none; border-radius: 10px; background: #ff3b52; color: #fff; font-weight: bold; }

  #dead { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(120,0,10,.4); color: #fff; z-index: 15; flex-direction: column; gap: 10px; }
  #dead .big { font-size: 40px; font-weight: 900; color: #ff3b52; text-shadow: 3px 3px 0 #000; }
  #dead small { font-size: 15px; opacity: .85; }
  #dead button { margin-top: 8px; padding: 12px 24px; background: #ffd23b; color: #000; border: none; border-radius: 10px; font-weight: 900; pointer-events: auto; }
</style>
</head>
<body>

<div id="start">
  <h1>DEADZONE</h1>
  <p>arena • respawn infinito</p>
  <input id="nameInput" maxlength="12" placeholder="Seu nome">
  <button id="playBtn">JOGAR</button>
</div>

<canvas id="game"></canvas>

<div id="hud">
  <div id="scoreboard">Placar</div>
  <div id="status">HP</div>
</div>

<div id="topRight">
  <button class="iconbtn" id="shopBtn">🛒 Loja</button>
  <button class="iconbtn" id="chatBtn">💬 Chat</button>
</div>

<div id="chatBox"><div id="chatMsgs"></div></div>
<div id="chatInputWrap">
  <input id="chatInput" maxlength="120" placeholder="Mensagem...">
  <button id="chatSend">Enviar</button>
</div>

<div id="stick"><div id="stickBase"></div><div id="stickKnob"></div></div>

<div id="weapons"></div>

<div id="actions"><button id="fire">🔫</button></div>

<div id="shop">
  <div id="shopBox">
    <h2>LOJA</h2>
    <div id="shopPts">Pontos: 0</div>
    <div id="shopItems"></div>
    <button id="shopClose">FECHAR</button>
  </div>
</div>

<div id="dead">
  <div class="big">☠️ MORREU</div>
  <small>respawn em instantes...</small>
  <button id="deadShop">🛒 Abrir Loja</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize); resize();

let ws, myId = null, world = { w: 1600, h: 1200 }, weapons = {}, gameMap = { walls: [], floor: '#2a2e3a' };
let state = { players: [], bullets: [], events: [], chat: [] };
let myAngle = 0;
const input = { up: false, down: false, left: false, right: false };
let currentWeapon = 'pistol';
let myData = null;

const particles = [], decals = [], muzzles = [];
let shake = 0;

function spawnBlood(x, y, angle, amount) {
  for (let i = 0; i < amount; i++) {
    const a = angle + (Math.random() - 0.5) * 1.6, sp = 2 + Math.random() * 5;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, r: 2 + Math.random() * 4, type: 'blood' });
  }
}
function spawnSpark(x, y) {
  for (let i = 0; i < 8; i++) {
    const a = Math.random() * Math.PI * 2, sp = 1 + Math.random() * 3;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, r: 1.5 + Math.random() * 2, type: 'spark' });
  }
}
function addDeathPool(x, y) {
  decals.push({ x, y, r: 4, maxR: 30 + Math.random() * 20, life: 1 });
  spawnBlood(x, y, Math.random() * Math.PI * 2, 30);
  shake = Math.min(shake + 8, 14);
}

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}`);
  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === 'init') {
      myId = msg.id; world = msg.world; weapons = msg.weapons; gameMap = msg.map;
      buildWeaponBar(); buildShop();
    } else if (msg.type === 'state') {
      state = msg;
      myData = state.players.find(p => p.id === myId) || myData;
      if (msg.events) for (const e of msg.events) {
        if (e.kind === 'hit') { spawnBlood(e.x, e.y, e.angle, 8); shake = Math.min(shake + 3, 10); }
        else if (e.kind === 'death') addDeathPool(e.x, e.y);
        else if (e.kind === 'spark') spawnSpark(e.x, e.y);
        else if (e.kind === 'muzzle') muzzles.push({ x: e.x, y: e.y, angle: e.angle, life: 1 });
      }
      if (msg.chat && msg.chat.length) for (const c of msg.chat) addChat(c);
      refreshWeaponBar(); refreshShop();
    } else if (msg.type === 'ping') {
      send({ type: 'pong' });
    } else if (msg.type === 'buyResult') {
      if (msg.ok) { currentWeapon = msg.weapon; flashMsg('Comprado! ' + weapons[msg.weapon].name); }
      else flashMsg('❌ ' + msg.reason);
    }
  };
  ws.onclose = () => setTimeout(connect, 1000);
}
function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

document.getElementById('playBtn').onclick = () => {
  const name = document.getElementById('nameInput').value.trim() || 'Player';
  connect();
  const wait = setInterval(() => { if (myId !== null) { clearInterval(wait); send({ type: 'setName', name }); } }, 100);
  document.getElementById('start').style.display = 'none';
};

// ---- Barra de armas (só as que possui) ----
function buildWeaponBar() {
  const bar = document.getElementById('weapons');
  bar.innerHTML = '';
  for (const key in weapons) {
    const btn = document.createElement('button');
    btn.className = 'wbtn'; btn.dataset.w = key;
    btn.textContent = weapons[key].name;
    btn.onclick = () => {
      if (!myData || !myData.owned[key]) { openShop(); return; }
      currentWeapon = key;
      send({ type: 'switchWeapon', weapon: key });
      document.getElementById('fire').textContent = '🔫';
    };
    bar.appendChild(btn);
  }
  refreshWeaponBar();
}
function refreshWeaponBar() {
  if (!myData) return;
  document.querySelectorAll('#weapons .wbtn').forEach(btn => {
    const k = btn.dataset.w;
    btn.classList.toggle('active', k === currentWeapon && myData.owned[k]);
    btn.classList.toggle('locked', !myData.owned[k]);
  });
}

// ---- Loja ----
function buildShop() {
  const items = document.getElementById('shopItems');
  items.innerHTML = '';
  for (const key in weapons) {
    const w = weapons[key];
    const row = document.createElement('div');
    row.className = 'shopItem'; row.dataset.w = key;
    row.innerHTML = `<div class="info">${w.name}<small>Dano ${w.damage} • ${w.cost === 0 ? 'inicial' : w.cost + ' pts'}</small></div>`;
    const btn = document.createElement('button');
    row.appendChild(btn); items.appendChild(row);
    btn.onclick = () => send({ type: 'buy', weapon: key });
  }
  refreshShop();
}
function refreshShop() {
  if (!myData) return;
  document.getElementById('shopPts').textContent = 'Pontos: ' + myData.points;
  document.querySelectorAll('#shopItems .shopItem').forEach(row => {
    const k = row.dataset.w, w = weapons[k], btn = row.querySelector('button');
    if (myData.owned[k]) { btn.textContent = 'Equipar'; btn.className = 'ownedBtn';
      btn.onclick = () => { currentWeapon = k; send({ type: 'switchWeapon', weapon: k }); closeShop(); };
    } else if (myData.points >= w.cost) { btn.textContent = 'Comprar'; btn.className = 'buyBtn';
      btn.onclick = () => send({ type: 'buy', weapon: k });
    } else { btn.textContent = w.cost + ' pts'; btn.className = 'cantBtn'; btn.onclick = null; }
  });
}
function openShop() { document.getElementById('shop').style.display = 'flex'; refreshShop(); }
function closeShop() { document.getElementById('shop').style.display = 'none'; }
document.getElementById('shopBtn').onclick = openShop;
document.getElementById('shopClose').onclick = closeShop;
document.getElementById('deadShop').onclick = openShop;

// ---- Chat ----
function addChat(c) {
  const box = document.getElementById('chatMsgs');
  const el = document.createElement('div');
  el.innerHTML = `<b style="color:${c.color}">${escapeHtml(c.name)}:</b> ${escapeHtml(c.text)}`;
  box.appendChild(el);
  while (box.children.length > 6) box.removeChild(box.firstChild);
  setTimeout(() => { if (el.parentNode) el.remove(); }, 12000);
}
function escapeHtml(s) { return String(s).replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m])); }
function flashMsg(text) { addChat({ name: 'sistema', color: '#ffd23b', text }); }

const chatWrap = document.getElementById('chatInputWrap');
const chatInput = document.getElementById('chatInput');
document.getElementById('chatBtn').onclick = () => { chatWrap.style.display = 'flex'; chatInput.focus(); };
function sendChat() {
  const t = chatInput.value.trim();
  if (t) send({ type: 'chat', text: t });
  chatInput.value = ''; chatWrap.style.display = 'none';
}
document.getElementById('chatSend').onclick = sendChat;
chatInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendChat(); if (e.key === 'Escape') { chatInput.value=''; chatWrap.style.display='none'; } });

// ---- Joystick ----
const stick = document.getElementById('stick'), knob = document.getElementById('stickKnob');
let stickId = null; const maxDist = 48;
stick.addEventListener('touchstart', (e) => { stickId = e.changedTouches[0].identifier; e.preventDefault(); });
stick.addEventListener('touchmove', (e) => {
  for (const t of e.changedTouches) {
    if (t.identifier !== stickId) continue;
    const rect = stick.getBoundingClientRect();
    let dx = t.clientX - rect.left - 65, dy = t.clientY - rect.top - 65;
    const d = Math.hypot(dx, dy);
    if (d > maxDist) { dx = dx / d * maxDist; dy = dy / d * maxDist; }
    knob.style.left = (36 + dx) + 'px'; knob.style.top = (36 + dy) + 'px';
    const dead = 12;
    input.left = dx < -dead; input.right = dx > dead; input.up = dy < -dead; input.down = dy > dead;
    if (d > dead) myAngle = Math.atan2(dy, dx);
  }
  e.preventDefault();
});
function stickEnd() { stickId = null; knob.style.left = '36px'; knob.style.top = '36px'; input.up = input.down = input.left = input.right = false; }
stick.addEventListener('touchend', stickEnd); stick.addEventListener('touchcancel', stickEnd);

// ---- Tiro ----
const fireBtn = document.getElementById('fire');
let fireInterval = null;
function startFire(e) { send({ type: 'attack' }); fireInterval = setInterval(() => send({ type: 'attack' }), 100); if (e) e.preventDefault(); }
function stopFire(e) { clearInterval(fireInterval); if (e) e.preventDefault(); }
fireBtn.addEventListener('touchstart', startFire); fireBtn.addEventListener('touchend', stopFire);
fireBtn.addEventListener('mousedown', startFire); fireBtn.addEventListener('mouseup', stopFire);

// ---- Desktop ----
window.addEventListener('keydown', (e) => {
  if (document.activeElement === chatInput) return;
  if (e.key === 'w' || e.key === 'ArrowUp') input.up = true;
  if (e.key === 's' || e.key === 'ArrowDown') input.down = true;
  if (e.key === 'a' || e.key === 'ArrowLeft') input.left = true;
  if (e.key === 'd' || e.key === 'ArrowRight') input.right = true;
  if (e.key === ' ') send({ type: 'attack' });
  if (e.key === 'Enter') { chatWrap.style.display = 'flex'; chatInput.focus(); }
});
window.addEventListener('keyup', (e) => {
  if (e.key === 'w' || e.key === 'ArrowUp') input.up = false;
  if (e.key === 's' || e.key === 'ArrowDown') input.down = false;
  if (e.key === 'a' || e.key === 'ArrowLeft') input.left = false;
  if (e.key === 'd' || e.key === 'ArrowRight') input.right = false;
});
window.addEventListener('mousemove', (e) => { myAngle = Math.atan2(e.clientY - H / 2, e.clientX - W / 2); });

setInterval(() => { if (myId !== null) send({ type: 'input', input, angle: myAngle }); }, 50);

// ---- Personagem bean ----
let animTime = 0;
const prevPos = {};
function drawBean(sx, sy, p, isMe) {
  const bob = p.moving ? Math.sin(animTime * 12 + p.id) * 3 : 0;
  const legSwing = p.moving ? Math.sin(animTime * 12 + p.id) * 5 : 0;
  ctx.save(); ctx.translate(sx, sy + bob);
  ctx.fillStyle = 'rgba(0,0,0,.3)';
  ctx.beginPath(); ctx.ellipse(0, 20, 16, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = shade(p.color, -30);
  ctx.fillRect(-9, 14 - Math.max(0, legSwing), 7, 10 + Math.max(0, legSwing));
  ctx.fillRect(2, 14 + Math.max(0, -legSwing), 7, 10 + Math.max(0, -legSwing));
  ctx.fillStyle = p.color; roundRect(-15, -20, 30, 38, 15); ctx.fill();
  ctx.fillStyle = shade(p.color, 40); roundRect(-8, -6, 16, 22, 8); ctx.fill();
  ctx.strokeStyle = shade(p.color, -50); ctx.lineWidth = 2.5; roundRect(-15, -20, 30, 38, 15); ctx.stroke();
  const ex = Math.cos(p.angle) * 5, ey = Math.sin(p.angle) * 3;
  ctx.fillStyle = '#bfe6ff'; roundRect(-3 + ex, -14 + ey, 16, 11, 5); ctx.fill();
  ctx.strokeStyle = shade(p.color, -50); ctx.lineWidth = 2; roundRect(-3 + ex, -14 + ey, 16, 11, 5); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.beginPath(); ctx.arc(2 + ex, -11 + ey, 2, 0, Math.PI * 2); ctx.fill();
  ctx.save(); ctx.rotate(p.angle); ctx.fillStyle = '#2a2a2a';
  ctx.fillRect(12, -3, 16, 6);
  if (p.weapon === 'rifle' || p.weapon === 'sniper') ctx.fillRect(12, -2.5, 26, 5);
  if (p.weapon === 'shotgun') ctx.fillRect(12, -4, 18, 8);
  ctx.restore();
  if (isMe) { ctx.strokeStyle = '#ffd23b'; ctx.lineWidth = 2; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.arc(0, 0, 26, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); }
  ctx.restore();
  ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif';
  ctx.strokeStyle = '#000'; ctx.lineWidth = 3; ctx.strokeText(p.name, sx, sy - 32); ctx.fillText(p.name, sx, sy - 32);
  ctx.fillStyle = '#000'; ctx.fillRect(sx - 20, sy - 28, 40, 5);
  ctx.fillStyle = p.hp > 50 ? '#4ade5f' : (p.hp > 25 ? '#ffb03b' : '#ff3b52');
  ctx.fillRect(sx - 20, sy - 28, 40 * (p.hp / 100), 5);
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function shade(hsl, amt) {
  const m = hsl.match(/hsl\((\d+),\s*(\d+)%,\s*(\d+)%\)/);
  if (!m) return hsl;
  let l = Math.max(0, Math.min(100, +m[3] + amt));
  return `hsl(${m[1]}, ${m[2]}%, ${l}%)`;
}

function draw() {
  animTime += 1 / 60;
  const me = state.players.find(p => p.id === myId);
  let camX = me ? me.x - W / 2 : world.w / 2 - W / 2;
  let camY = me ? me.y - H / 2 : world.h / 2 - H / 2;
  if (shake > 0) { camX += (Math.random() - 0.5) * shake; camY += (Math.random() - 0.5) * shake; shake *= 0.85; if (shake < 0.3) shake = 0; }

  ctx.fillStyle = '#101018'; ctx.fillRect(0, 0, W, H);
  // piso do mundo
  ctx.fillStyle = gameMap.floor; ctx.fillRect(-camX, -camY, world.w, world.h);
  // grade
  ctx.strokeStyle = 'rgba(255,255,255,.04)'; ctx.lineWidth = 1;
  for (let x = 0; x <= world.w; x += 80) { ctx.beginPath(); ctx.moveTo(x - camX, -camY); ctx.lineTo(x - camX, world.h - camY); ctx.stroke(); }
  for (let y = 0; y <= world.h; y += 80) { ctx.beginPath(); ctx.moveTo(-camX, y - camY); ctx.lineTo(world.w - camX, y - camY); ctx.stroke(); }

  // poças de sangue (sob tudo)
  for (let i = decals.length - 1; i >= 0; i--) {
    const d = decals[i]; if (d.r < d.maxR) d.r += 1;
    ctx.fillStyle = 'rgba(140,10,20,.75)'; ctx.beginPath(); ctx.arc(d.x - camX, d.y - camY, d.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(180,20,30,.6)'; ctx.beginPath(); ctx.arc(d.x - camX - d.r * 0.3, d.y - camY, d.r * 0.5, 0, Math.PI * 2); ctx.fill();
    d.life -= 0.0015; if (d.life <= 0) decals.splice(i, 1);
  }
  if (decals.length > 40) decals.splice(0, decals.length - 40);

  // paredes
  for (const wl of gameMap.walls) {
    ctx.fillStyle = '#4a4a58'; ctx.fillRect(wl.x - camX, wl.y - camY, wl.w, wl.h);
    ctx.fillStyle = '#5a5a6a'; ctx.fillRect(wl.x - camX, wl.y - camY, wl.w, 5);
    ctx.strokeStyle = '#2a2a34'; ctx.lineWidth = 2; ctx.strokeRect(wl.x - camX, wl.y - camY, wl.w, wl.h);
  }

  // borda do mundo
  ctx.strokeStyle = '#ff3b52'; ctx.lineWidth = 5; ctx.strokeRect(-camX, -camY, world.w, world.h);

  // muzzle flash
  for (let i = muzzles.length - 1; i >= 0; i--) {
    const m2 = muzzles[i]; m2.life -= 0.2;
    if (m2.life <= 0) { muzzles.splice(i, 1); continue; }
    const fx = m2.x + Math.cos(m2.angle) * 28 - camX, fy = m2.y + Math.sin(m2.angle) * 28 - camY;
    ctx.fillStyle = `rgba(255,220,120,${m2.life})`;
    ctx.beginPath(); ctx.arc(fx, fy, 8 * m2.life + 3, 0, Math.PI * 2); ctx.fill();
  }

  // balas
  for (const b of state.bullets) {
    ctx.fillStyle = '#ffe08a'; ctx.beginPath(); ctx.arc(b.x - camX, b.y - camY, 4, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,224,138,.4)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(b.x - camX, b.y - camY); ctx.lineTo(b.x - camX - 10, b.y - camY); ctx.stroke();
  }

  // jogadores
  for (const p of state.players) {
    if (!p.alive) continue;
    const pv = prevPos[p.id];
    p.moving = pv ? (Math.abs(pv.x - p.x) > 0.5 || Math.abs(pv.y - p.y) > 0.5) : false;
    prevPos[p.id] = { x: p.x, y: p.y };
    drawBean(p.x - camX, p.y - camY, p, p.id === myId);
  }

  // partículas
  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.15; pt.vx *= 0.96; pt.life -= 0.03;
    if (pt.life <= 0) { particles.splice(i, 1); continue; }
    ctx.fillStyle = pt.type === 'blood' ? `rgba(200,20,30,${pt.life})` : `rgba(255,220,120,${pt.life})`;
    ctx.beginPath(); ctx.arc(pt.x - camX, pt.y - camY, pt.r * pt.life, 0, Math.PI * 2); ctx.fill();
  }

  // HUD
  const sorted = [...state.players].sort((a, b) => b.kills - a.kills).slice(0, 5);
  document.getElementById('scoreboard').innerHTML =
    sorted.map(p => `${p.id === myId ? '▶ ' : ''}${p.name}: ${p.kills}💀`).join('<br>') || 'Placar';
  document.getElementById('status').innerHTML = me
    ? `HP: ${Math.max(0, me.hp)}<br>Kills: ${me.kills}<br><b>💰 ${me.points} pts</b>` : 'Conectando...';
  document.getElementById('dead').style.display = (me && !me.alive) ? 'flex' : 'none';

  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
