<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>DEADZONE</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; -webkit-user-select: none; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0d0d12; font-family: system-ui, sans-serif; }
  #game { display: block; }

  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
           background: linear-gradient(180deg, #1a2a3a 0%, #0d1520 55%, #050810 100%); z-index: 30; gap: 4px; overflow: hidden; }
  /* montanhas dos alpes em camadas */
  #alps { position: absolute; bottom: 0; left: 0; width: 100%; height: 55%; z-index: 0; }
  #start .presents { color: #9fc4e8; font-size: 15px; letter-spacing: 1px; z-index: 2; margin-bottom: 2px; text-shadow: 0 2px 6px #000; }
  #start .brand { color: #ffd23b; font-size: 22px; font-weight: 800; letter-spacing: 1px; z-index: 2; text-shadow: 0 2px 8px #000; margin-bottom: 14px; }
  #start h1 { color: #ff3b52; font-size: 52px; letter-spacing: 3px; font-weight: 900; z-index: 2;
              text-shadow: 0 0 24px rgba(255,59,82,.7), 4px 4px 0 #000; line-height: .95; text-align: center; }
  #start .edition { color: #bfe6ff; font-size: 20px; font-weight: 800; letter-spacing: 6px; z-index: 2; text-shadow: 0 2px 8px #000; margin-top: 2px; }
  #start .snow { color: #7fb0dd; font-size: 12px; z-index: 2; margin-top: 6px; }
  #start input { margin-top: 22px; padding: 13px 16px; font-size: 16px; border-radius: 10px; border: 2px solid #2a4a66; background: rgba(10,20,32,.85); color: #fff; width: 240px; text-align: center; z-index: 2; }
  #start button { margin-top: 12px; padding: 16px 52px; font-size: 22px; border: none; border-radius: 12px; background: #ff3b52; color: #fff; font-weight: 900; letter-spacing: 2px; box-shadow: 0 5px 0 #a01828; z-index: 2; }
  #start button:active { transform: translateY(5px); box-shadow: 0 0 0 #a01828; }
  #start .lvlnote { color: #9fc4e8; font-size: 12px; z-index: 2; margin-top: 14px; }

  #hud { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; color: #fff; font-size: 13px; z-index: 10; pointer-events: none; }
  #scoreboard, #status { background: rgba(0,0,0,.55); padding: 10px 14px; border-radius: 10px; line-height: 1.6; border: 1px solid #333; }
  #status { text-align: right; margin-right: 96px; } /* espaço p/ os botões da direita */
  #status b { color: #ffd23b; }
  #levelBadge { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 10; background: linear-gradient(180deg,#ffd23b,#e8a800); color: #201500; font-weight: 900; padding: 8px 16px; border-radius: 12px; font-size: 14px; box-shadow: 0 3px 0 #a87700; text-align: center; }
  #levelBadge small { display: block; font-size: 10px; font-weight: 700; opacity: .8; }
  #xpBar { width: 120px; height: 5px; background: rgba(0,0,0,.4); border-radius: 3px; margin-top: 4px; overflow: hidden; }
  #xpFill { height: 100%; width: 0%; background: #fff; }

  #stick { position: fixed; bottom: 34px; left: 34px; width: 130px; height: 130px; z-index: 10; }
  #stickBase { position: absolute; inset: 0; border-radius: 50%; background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.15); }
  #stickKnob { position: absolute; width: 58px; height: 58px; left: 36px; top: 36px; border-radius: 50%; background: rgba(255,59,82,.55); border: 2px solid rgba(255,255,255,.4); }

  #actions { position: fixed; bottom: 34px; right: 34px; z-index: 10; display: flex; flex-direction: column; gap: 12px; align-items: center; }
  #fire { width: 96px; height: 96px; border-radius: 50%; background: rgba(255,59,82,.85); border: 3px solid rgba(255,255,255,.35); color: #fff; font-size: 30px; box-shadow: 0 4px 0 #a01828; }
  #fire:active { transform: translateY(4px); box-shadow: 0 0 0 #a01828; }
  #topRight { position: fixed; top: 12px; right: 12px; z-index: 10; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
  .iconbtn { padding: 10px 14px; border-radius: 9px; border: 2px solid #444; background: rgba(0,0,0,.6); color: #fff; font-size: 14px; font-weight: bold; }
  #weapons { position: fixed; bottom: 140px; right: 34px; z-index: 10; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: 220px; }
  .wbtn { padding: 8px 11px; border-radius: 9px; border: 2px solid transparent; background: rgba(0,0,0,.5); color: #fff; font-size: 12px; font-weight: bold; }
  .wbtn.active { border-color: #ffd23b; background: rgba(255,210,59,.22); color: #ffd23b; }
  .wbtn.locked { opacity: .4; }

  /* Loja */
  #shop { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.75); z-index: 25; }
  #shopBox { background: #16161f; border: 2px solid #ff3b52; border-radius: 16px; padding: 22px; width: 320px; max-width: 90%; }
  #shopBox h2 { color: #ff3b52; text-align: center; margin-bottom: 4px; letter-spacing: 2px; }
  #shopPts { color: #ffd23b; text-align: center; margin-bottom: 14px; font-weight: bold; }
  .shopItem { display: flex; justify-content: space-between; align-items: center; background: #1e1e28; border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  .shopItem .info { color: #fff; }
  .shopItem .info small { color: #888; display: block; }
  .shopItem button { padding: 8px 14px; border: none; border-radius: 8px; font-weight: bold; }
  .buyBtn { background: #ffd23b; color: #000; }
  .ownedBtn { background: #2e7d4a; color: #fff; }
  .cantBtn { background: #444; color: #999; }
  #shopClose { width: 100%; margin-top: 6px; padding: 12px; background: #ff3b52; color: #fff; border: none; border-radius: 10px; font-weight: 900; }

  /* Chat */
  #chatBox { position: fixed; bottom: 180px; left: 14px; width: 260px; max-width: 55%; z-index: 10; pointer-events: none; }
  #chatMsgs { display: flex; flex-direction: column; gap: 3px; font-size: 12px; }
  #chatMsgs div { background: rgba(0,0,0,.5); padding: 4px 8px; border-radius: 6px; color: #fff; width: fit-content; max-width: 100%; }
  #chatInputWrap { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 26; display: none; gap: 6px; width: 90%; max-width: 400px; }
  #chatInput { flex: 1; padding: 12px; border-radius: 10px; border: 2px solid #444; background: #1a1a22; color: #fff; font-size: 15px; }
  #chatSend { padding: 12px 18px; border: none; border-radius: 10px; background: #ff3b52; color: #fff; font-weight: bold; }

  #dead { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(120,0,10,.4); color: #fff; z-index: 15; flex-direction: column; gap: 10px; }
  #dead .big { font-size: 40px; font-weight: 900; color: #ff3b52; text-shadow: 3px 3px 0 #000; }
  #dead small { font-size: 15px; opacity: .85; }
  #dead button { margin-top: 8px; padding: 12px 24px; background: #ffd23b; color: #000; border: none; border-radius: 10px; font-weight: 900; pointer-events: auto; }
</style>
</head>
<body>

<div id="start">
  <svg id="alps" viewBox="0 0 800 400" preserveAspectRatio="none">
    <polygon points="0,400 120,180 260,320 400,120 560,300 680,200 800,360 800,400" fill="#24384d"/>
    <polygon points="0,400 160,260 300,360 460,220 620,340 800,280 800,400" fill="#1a2a3a"/>
    <!-- neve nos picos -->
    <polygon points="400,120 370,175 430,175" fill="#dceaf7"/>
    <polygon points="120,180 100,215 145,215" fill="#dceaf7"/>
    <polygon points="560,300 540,330 585,330" fill="#cfe0f0"/>
  </svg>
  <div class="presents">Bubu e Julinha apresenta</div>
  <div class="brand">🏔️ um jogo dos campeões 🏔️</div>
  <h1>DEADZONE</h1>
  <div class="edition">ALPES EDITION</div>
  <div class="snow">❄️ arena • respawn infinito • suba de nível ❄️</div>
  <input id="nameInput" maxlength="12" placeholder="Seu nome de guerra">
  <button id="playBtn">JOGAR ▶</button>
  <div class="lvlnote" id="lvlnote"></div>
</div>

<canvas id="game"></canvas>

<div id="hud">
  <div id="scoreboard">Placar</div>
  <div id="status">HP</div>
</div>

<div id="levelBadge">NÍVEL 1<small>0 XP</small><div id="xpBar"><div id="xpFill"></div></div></div>

<div id="topRight">
  <button class="iconbtn" id="shopBtn">🛒 Loja</button>
  <button class="iconbtn" id="chatBtn">💬 Chat</button>
</div>

<div id="chatBox"><div id="chatMsgs"></div></div>
<div id="chatInputWrap">
  <input id="chatInput" maxlength="120" placeholder="Mensagem...">
  <button id="chatSend">Enviar</button>
</div>

<div id="stick"><div id="stickBase"></div><div id="stickKnob"></div></div>

<div id="weapons"></div>

<div id="actions"><button id="fire">🩴</button></div>

<div id="shop">
  <div id="shopBox">
    <h2>LOJA</h2>
    <div id="shopPts">Pontos: 0</div>
    <div id="shopItems"></div>
    <button id="shopClose">FECHAR</button>
  </div>
</div>

<div id="dead">
  <div class="big">☠️ MORREU</div>
  <small>respawn em instantes...</small>
  <button id="deadShop">🛒 Abrir Loja</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2); // até 2x pra não pesar demais
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); // desenha em coordenadas CSS, nitidez retina
}
window.addEventListener('resize', resize); resize();

let ws, myId = null, world = { w: 1600, h: 1200 }, weapons = {}, gameMap = { walls: [], floor: '#2a2e3a' };
let state = { players: [], bullets: [], events: [], chat: [] };
let myAngle = 0;
const input = { up: false, down: false, left: false, right: false };
let currentWeapon = 'chinelo';
let myData = null;
const render = {}; // posições interpoladas por id: {x,y,tx,ty}

const particles = [], decals = [], muzzles = [], auras = [];
let shake = 0;

// ==================== SISTEMA DE LEVEL (localStorage) ====================
// XP persiste no navegador do jogador. Cada kill dá XP; nível sobe por limiar crescente.
let profile = { xp: 0, level: 1 };
try { const s = localStorage.getItem('deadzone_profile'); if (s) profile = JSON.parse(s); } catch {}
function xpForLevel(lvl) { return Math.floor(100 * Math.pow(lvl, 1.5)); } // XP total p/ alcançar o nível
function levelFromXp(xp) { let l = 1; while (xp >= xpForLevel(l + 1)) l++; return l; }
function saveProfile() { try { localStorage.setItem('deadzone_profile', JSON.stringify(profile)); } catch {} }
function addXp(amount) {
  const before = profile.level;
  profile.xp += amount;
  profile.level = levelFromXp(profile.xp);
  saveProfile();
  updateLevelUI();
  if (profile.level > before) onLevelUp(profile.level);
}
function updateLevelUI() {
  const cur = xpForLevel(profile.level), next = xpForLevel(profile.level + 1);
  const pct = Math.max(0, Math.min(100, ((profile.xp - cur) / (next - cur)) * 100));
  const badge = document.getElementById('levelBadge');
  badge.childNodes[0].nodeValue = 'NÍVEL ' + profile.level;
  badge.querySelector('small').textContent = profile.xp + ' XP';
  document.getElementById('xpFill').style.width = pct + '%';
}
function onLevelUp(newLevel) {
  sound.levelup();
  flashMsg('⬆️ SUBIU PARA O NÍVEL ' + newLevel + '!');
  // avisa o servidor do novo nível pra aplicar buff
  send({ type: 'setName', name: myName, level: newLevel });
}

// ==================== ENGINE DE SOM (Web Audio API, sintético) ====================
// Sem arquivos. Para trocar por MP3 depois: crie um <audio> ou use fetch+decodeAudioData
// e substitua os corpos das funções abaixo por audio.play().
let audioCtx = null;
function initAudio() { if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} } }
function tone(freq, dur, type, vol, sweepTo) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  osc.type = type || 'square';
  osc.frequency.setValueAtTime(freq, t);
  if (sweepTo) osc.frequency.exponentialRampToValueAtTime(sweepTo, t + dur);
  gain.gain.setValueAtTime(vol || 0.15, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + dur);
}
function noise(dur, vol) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * dur, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
  const src = audioCtx.createBufferSource(); src.buffer = buf;
  const gain = audioCtx.createGain(); gain.gain.setValueAtTime(vol || 0.2, t); gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(gain); gain.connect(audioCtx.destination); src.start(t);
}
const sound = {
  chinelo: () => { tone(420, 0.09, 'triangle', 0.14, 180); }, // "vupt" do chinelo girando
  escova:  () => tone(300, 0.04, 'square', 0.08, 220),        // metralha rápida
  coco:    () => { noise(0.2, 0.22); tone(90, 0.18, 'sawtooth', 0.12, 50); }, // splat
  espada:  () => { tone(800, 0.14, 'sawtooth', 0.18, 200); tone(1200,0.08,'sine',0.1); }, // corte metálico
  death:   () => tone(200, 0.4, 'sawtooth', 0.2, 40),
  hit:     () => tone(500, 0.04, 'square', 0.06),
  buy:     () => { tone(600, 0.08, 'sine', 0.15); setTimeout(()=>tone(900,0.1,'sine',0.15),80); },
  levelup: () => { [500,700,900,1200].forEach((f,i)=>setTimeout(()=>tone(f,0.15,'sine',0.18),i*90)); },
  shoot:   (w) => { if (sound[w]) sound[w](); else sound.chinelo(); }
};

function spawnBlood(x, y, angle, amount) {
  for (let i = 0; i < amount; i++) {
    const a = angle + (Math.random() - 0.5) * 1.6, sp = 2 + Math.random() * 5;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, r: 2 + Math.random() * 4, type: 'blood' });
  }
}
function spawnSpark(x, y) {
  for (let i = 0; i < 8; i++) {
    const a = Math.random() * Math.PI * 2, sp = 1 + Math.random() * 3;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, r: 1.5 + Math.random() * 2, type: 'spark' });
  }
}
function addDeathPool(x, y) {
  decals.push({ x, y, r: 4, maxR: 30 + Math.random() * 20, life: 1 });
  spawnBlood(x, y, Math.random() * Math.PI * 2, 30);
  shake = Math.min(shake + 8, 14);
}

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}`);
  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === 'init') {
      myId = msg.id; world = msg.world; weapons = msg.weapons; gameMap = msg.map;
      buildWeaponBar(); buildShop();
    } else if (msg.type === 'state') {
      state = msg;
      myData = state.players.find(p => p.id === myId) || myData;
      // guarda alvo de interpolação por jogador
      for (const p of state.players) {
        if (!render[p.id]) render[p.id] = { x: p.x, y: p.y };
        render[p.id].tx = p.x; render[p.id].ty = p.y;
      }
      for (const id in render) if (!state.players.find(p => p.id == id)) delete render[id];
      if (msg.events) for (const e of msg.events) {
        if (e.kind === 'hit') { spawnBlood(e.x, e.y, e.angle, 8); shake = Math.min(shake + 3, 10); sound.hit(); }
        else if (e.kind === 'death') { addDeathPool(e.x, e.y); sound.death(); }
        else if (e.kind === 'spark') spawnSpark(e.x, e.y);
        else if (e.kind === 'muzzle') {
          muzzles.push({ x: e.x, y: e.y, angle: e.angle, life: 1 });
          // som do tiro só pra tiros próximos de mim (evita cacofonia)
          const me = state.players.find(p => p.id === myId);
          if (me && Math.hypot(me.x - e.x, me.y - e.y) < 900) {
            const shooter = state.players.find(p => Math.abs(p.x - e.x) < 30 && Math.abs(p.y - e.y) < 30);
            sound.shoot(shooter ? shooter.weapon : 'chinelo');
          }
        }
        else if (e.kind === 'kill') {
          // aura super sayajin no matador
          auras.push({ id: e.killer, life: 1.4 });
          if (e.killer === myId) { addXp(60); } // XP só pra mim, salvo no meu navegador
        }
      }
      if (msg.chat && msg.chat.length) for (const c of msg.chat) addChat(c);
      refreshWeaponBar(); refreshShop();
    } else if (msg.type === 'ping') {
      send({ type: 'pong' });
    } else if (msg.type === 'buyResult') {
      if (msg.ok) { currentWeapon = msg.weapon; sound.buy(); flashMsg('Comprado! ' + weapons[msg.weapon].name); }
      else flashMsg('❌ ' + msg.reason);
    }
  };
  ws.onclose = () => setTimeout(connect, 1000);
}
function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

let myName = 'Player';
// mostra o nível salvo na abertura
(function(){ const n = document.getElementById('lvlnote'); if (n) n.textContent = profile.level > 1 ? `🔥 Bem-vindo de volta! Você é nível ${profile.level}` : ''; })();
document.getElementById('playBtn').onclick = () => {
  myName = document.getElementById('nameInput').value.trim() || 'Player';
  initAudio(); // precisa ser após um toque/clique do usuário
  profile.level = levelFromXp(profile.xp);
  updateLevelUI();
  connect();
  const wait = setInterval(() => { if (myId !== null) { clearInterval(wait); send({ type: 'setName', name: myName, level: profile.level }); } }, 100);
  document.getElementById('start').style.display = 'none';
};

// ---- Barra de armas (só as que possui) ----
function buildWeaponBar() {
  const bar = document.getElementById('weapons');
  bar.innerHTML = '';
  for (const key in weapons) {
    const btn = document.createElement('button');
    btn.className = 'wbtn'; btn.dataset.w = key;
    btn.textContent = (weapons[key].emoji || '') + ' ' + weapons[key].name;
    btn.onclick = () => {
      if (!myData || !myData.owned[key]) { openShop(); return; }
      currentWeapon = key;
      send({ type: 'switchWeapon', weapon: key });
      document.getElementById('fire').textContent = (weapons[key] && weapons[key].emoji) || '🩴';
    };
    bar.appendChild(btn);
  }
  refreshWeaponBar();
}
function refreshWeaponBar() {
  if (!myData) return;
  document.querySelectorAll('#weapons .wbtn').forEach(btn => {
    const k = btn.dataset.w;
    btn.classList.toggle('active', k === currentWeapon && myData.owned[k]);
    btn.classList.toggle('locked', !myData.owned[k]);
  });
}

// ---- Loja ----
function buildShop() {
  const items = document.getElementById('shopItems');
  items.innerHTML = '';
  for (const key in weapons) {
    const w = weapons[key];
    const row = document.createElement('div');
    row.className = 'shopItem'; row.dataset.w = key;
    row.innerHTML = `<div class="info">${w.emoji || ''} ${w.name}<small>Dano ${w.damage} • ${w.cost === 0 ? 'inicial' : w.cost + ' pts'}</small></div>`;
    const btn = document.createElement('button');
    row.appendChild(btn); items.appendChild(row);
    btn.onclick = () => send({ type: 'buy', weapon: key });
  }
  refreshShop();
}
function refreshShop() {
  if (!myData) return;
  document.getElementById('shopPts').textContent = 'Pontos: ' + myData.points;
  document.querySelectorAll('#shopItems .shopItem').forEach(row => {
    const k = row.dataset.w, w = weapons[k], btn = row.querySelector('button');
    if (myData.owned[k]) { btn.textContent = 'Equipar'; btn.className = 'ownedBtn';
      btn.onclick = () => { currentWeapon = k; send({ type: 'switchWeapon', weapon: k }); closeShop(); };
    } else if (myData.points >= w.cost) { btn.textContent = 'Comprar'; btn.className = 'buyBtn';
      btn.onclick = () => send({ type: 'buy', weapon: k });
    } else { btn.textContent = w.cost + ' pts'; btn.className = 'cantBtn'; btn.onclick = null; }
  });
}
function openShop() { document.getElementById('shop').style.display = 'flex'; refreshShop(); }
function closeShop() { document.getElementById('shop').style.display = 'none'; }
document.getElementById('shopBtn').onclick = openShop;
document.getElementById('shopClose').onclick = closeShop;
document.getElementById('deadShop').onclick = openShop;

// ---- Chat ----
function addChat(c) {
  const box = document.getElementById('chatMsgs');
  const el = document.createElement('div');
  el.innerHTML = `<b style="color:${c.color}">${escapeHtml(c.name)}:</b> ${escapeHtml(c.text)}`;
  box.appendChild(el);
  while (box.children.length > 6) box.removeChild(box.firstChild);
  setTimeout(() => { if (el.parentNode) el.remove(); }, 12000);
}
function escapeHtml(s) { return String(s).replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m])); }
function flashMsg(text) { addChat({ name: 'sistema', color: '#ffd23b', text }); }

const chatWrap = document.getElementById('chatInputWrap');
const chatInput = document.getElementById('chatInput');
document.getElementById('chatBtn').onclick = () => { chatWrap.style.display = 'flex'; chatInput.focus(); };
function sendChat() {
  const t = chatInput.value.trim();
  if (t) send({ type: 'chat', text: t });
  chatInput.value = ''; chatWrap.style.display = 'none';
}
document.getElementById('chatSend').onclick = sendChat;
chatInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendChat(); if (e.key === 'Escape') { chatInput.value=''; chatWrap.style.display='none'; } });

// ---- Joystick ----
const stick = document.getElementById('stick'), knob = document.getElementById('stickKnob');
let stickId = null; const maxDist = 48;
stick.addEventListener('touchstart', (e) => { stickId = e.changedTouches[0].identifier; e.preventDefault(); });
stick.addEventListener('touchmove', (e) => {
  for (const t of e.changedTouches) {
    if (t.identifier !== stickId) continue;
    const rect = stick.getBoundingClientRect();
    let dx = t.clientX - rect.left - 65, dy = t.clientY - rect.top - 65;
    const d = Math.hypot(dx, dy);
    if (d > maxDist) { dx = dx / d * maxDist; dy = dy / d * maxDist; }
    knob.style.left = (36 + dx) + 'px'; knob.style.top = (36 + dy) + 'px';
    const dead = 12;
    input.left = dx < -dead; input.right = dx > dead; input.up = dy < -dead; input.down = dy > dead;
    if (d > dead) myAngle = Math.atan2(dy, dx);
  }
  e.preventDefault();
});
function stickEnd() { stickId = null; knob.style.left = '36px'; knob.style.top = '36px'; input.up = input.down = input.left = input.right = false; }
stick.addEventListener('touchend', stickEnd); stick.addEventListener('touchcancel', stickEnd);

// ---- Tiro ----
const fireBtn = document.getElementById('fire');
let fireInterval = null;
function startFire(e) { send({ type: 'attack' }); fireInterval = setInterval(() => send({ type: 'attack' }), 100); if (e) e.preventDefault(); }
function stopFire(e) { clearInterval(fireInterval); if (e) e.preventDefault(); }
fireBtn.addEventListener('touchstart', startFire); fireBtn.addEventListener('touchend', stopFire);
fireBtn.addEventListener('mousedown', startFire); fireBtn.addEventListener('mouseup', stopFire);

// ---- Desktop ----
window.addEventListener('keydown', (e) => {
  if (document.activeElement === chatInput) return;
  if (e.key === 'w' || e.key === 'ArrowUp') input.up = true;
  if (e.key === 's' || e.key === 'ArrowDown') input.down = true;
  if (e.key === 'a' || e.key === 'ArrowLeft') input.left = true;
  if (e.key === 'd' || e.key === 'ArrowRight') input.right = true;
  if (e.key === ' ') send({ type: 'attack' });
  if (e.key === 'Enter') { chatWrap.style.display = 'flex'; chatInput.focus(); }
});
window.addEventListener('keyup', (e) => {
  if (e.key === 'w' || e.key === 'ArrowUp') input.up = false;
  if (e.key === 's' || e.key === 'ArrowDown') input.down = false;
  if (e.key === 'a' || e.key === 'ArrowLeft') input.left = false;
  if (e.key === 'd' || e.key === 'ArrowRight') input.right = false;
});
window.addEventListener('mousemove', (e) => { myAngle = Math.atan2(e.clientY - H / 2, e.clientX - W / 2); });

setInterval(() => { if (myId !== null) send({ type: 'input', input, angle: myAngle }); }, 50);

// ---- Personagem bean ----
let animTime = 0;
const prevPos = {};
function drawBean(sx, sy, p, isMe) {
  const bob = p.moving ? Math.sin(animTime * 12 + p.id) * 3 : 0;
  const legSwing = p.moving ? Math.sin(animTime * 12 + p.id) * 5 : 0;
  ctx.save(); ctx.translate(sx, sy + bob);
  ctx.fillStyle = 'rgba(0,0,0,.3)';
  ctx.beginPath(); ctx.ellipse(0, 20, 16, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = shade(p.color, -30);
  ctx.fillRect(-9, 14 - Math.max(0, legSwing), 7, 10 + Math.max(0, legSwing));
  ctx.fillRect(2, 14 + Math.max(0, -legSwing), 7, 10 + Math.max(0, -legSwing));
  ctx.fillStyle = p.color; roundRect(-15, -20, 30, 38, 15); ctx.fill();
  ctx.fillStyle = shade(p.color, 40); roundRect(-8, -6, 16, 22, 8); ctx.fill();
  ctx.strokeStyle = shade(p.color, -50); ctx.lineWidth = 2.5; roundRect(-15, -20, 30, 38, 15); ctx.stroke();
  const ex = Math.cos(p.angle) * 5, ey = Math.sin(p.angle) * 3;
  ctx.fillStyle = '#bfe6ff'; roundRect(-3 + ex, -14 + ey, 16, 11, 5); ctx.fill();
  ctx.strokeStyle = shade(p.color, -50); ctx.lineWidth = 2; roundRect(-3 + ex, -14 + ey, 16, 11, 5); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.beginPath(); ctx.arc(2 + ex, -11 + ey, 2, 0, Math.PI * 2); ctx.fill();
  ctx.save(); ctx.rotate(p.angle);
  if (p.weapon === 'espada') { ctx.fillStyle = '#ffd23b'; ctx.fillRect(12, -2, 22, 4); ctx.fillStyle='#8a6a20'; ctx.fillRect(10,-3,4,6); }
  else if (p.weapon === 'coco') { ctx.fillStyle = '#6b4423'; ctx.beginPath(); ctx.arc(20,0,5,0,Math.PI*2); ctx.fill(); }
  else if (p.weapon === 'escova') { ctx.fillStyle = '#ff3b52'; ctx.fillRect(12,-3,14,6); ctx.fillStyle='#111'; ctx.fillRect(22,-4,5,8); }
  else { ctx.fillStyle = '#ff5fa2'; roundRect(12,-4,16,8,4); ctx.fill(); } // chinelo
  ctx.restore();
  if (isMe) { ctx.strokeStyle = '#ffd23b'; ctx.lineWidth = 2; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.arc(0, 0, 26, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); }
  ctx.restore();
  ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif';
  const label = (p.level && p.level > 1 ? 'Lv' + p.level + ' ' : '') + p.name;
  ctx.strokeStyle = '#000'; ctx.lineWidth = 3; ctx.strokeText(label, sx, sy - 32); ctx.fillText(label, sx, sy - 32);
  const maxHp = p.maxHp || 100;
  ctx.fillStyle = '#000'; ctx.fillRect(sx - 20, sy - 28, 40, 5);
  ctx.fillStyle = p.hp > maxHp * 0.5 ? '#4ade5f' : (p.hp > maxHp * 0.25 ? '#ffb03b' : '#ff3b52');
  ctx.fillRect(sx - 20, sy - 28, 40 * Math.max(0, p.hp / maxHp), 5);
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function shade(hsl, amt) {
  const m = hsl.match(/hsl\((\d+),\s*(\d+)%,\s*(\d+)%\)/);
  if (!m) return hsl;
  let l = Math.max(0, Math.min(100, +m[3] + amt));
  return `hsl(${m[1]}, ${m[2]}%, ${l}%)`;
}

const ZOOM = 0.72; // <1 = câmera mais afastada, enxerga mais da arena
function draw() {
  animTime += 1 / 60;

  // ---- interpola posições (movimento fluido entre updates do servidor) ----
  for (const id in render) {
    const r = render[id];
    if (r.tx !== undefined) { r.x += (r.tx - r.x) * 0.25; r.y += (r.ty - r.y) * 0.25; }
  }
  // posição interpolada do "eu" para a câmera
  const meRaw = state.players.find(p => p.id === myId);
  const meR = meRaw && render[myId] ? render[myId] : null;
  const meX = meR ? meR.x : (meRaw ? meRaw.x : world.w / 2);
  const meY = meR ? meR.y : (meRaw ? meRaw.y : world.h / 2);

  const viewW = W / ZOOM, viewH = H / ZOOM;
  let camX = meX - viewW / 2;
  let camY = meY - viewH / 2;
  // clamp: não mostra além das bordas; centraliza se o mundo é menor que a viewport
  if (world.w < viewW) camX = (world.w - viewW) / 2;
  else camX = Math.max(0, Math.min(world.w - viewW, camX));
  if (world.h < viewH) camY = (world.h - viewH) / 2;
  else camY = Math.max(0, Math.min(world.h - viewH, camY));
  if (shake > 0) { camX += (Math.random() - 0.5) * shake; camY += (Math.random() - 0.5) * shake; shake *= 0.85; if (shake < 0.3) shake = 0; }

  const me = meRaw; // alias p/ o resto do código (dados: hp, weapon, etc.)

  // limpa em coordenadas de tela
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#0a0a10'; ctx.fillRect(0, 0, W, H);
  ctx.setTransform(DPR * ZOOM, 0, 0, DPR * ZOOM, 0, 0);

  // ---- piso texturizado (xadrez sutil + vinheta) ----
  ctx.fillStyle = gameMap.floor; ctx.fillRect(-camX, -camY, world.w, world.h);
  const tile = 80;
  for (let gx = 0; gx < world.w; gx += tile) {
    for (let gy = 0; gy < world.h; gy += tile) {
      if (((gx / tile) + (gy / tile)) % 2 === 0) {
        ctx.fillStyle = 'rgba(255,255,255,.025)';
        ctx.fillRect(gx - camX, gy - camY, tile, tile);
      }
    }
  }
  // linhas de grade neon suaves
  ctx.strokeStyle = 'rgba(120,180,255,.05)'; ctx.lineWidth = 1;
  for (let x = 0; x <= world.w; x += tile) { ctx.beginPath(); ctx.moveTo(x - camX, -camY); ctx.lineTo(x - camX, world.h - camY); ctx.stroke(); }
  for (let y = 0; y <= world.h; y += tile) { ctx.beginPath(); ctx.moveTo(-camX, y - camY); ctx.lineTo(world.w - camX, y - camY); ctx.stroke(); }

  // poças de sangue
  for (let i = decals.length - 1; i >= 0; i--) {
    const d = decals[i]; if (d.r < d.maxR) d.r += 1;
    ctx.fillStyle = 'rgba(140,10,20,.75)'; ctx.beginPath(); ctx.arc(d.x - camX, d.y - camY, d.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(180,20,30,.6)'; ctx.beginPath(); ctx.arc(d.x - camX - d.r * 0.3, d.y - camY, d.r * 0.5, 0, Math.PI * 2); ctx.fill();
    d.life -= 0.0015; if (d.life <= 0) decals.splice(i, 1);
  }
  if (decals.length > 40) decals.splice(0, decals.length - 40);

  // ---- LINHA DE MIRA GUIA ----
  if (me && me.alive) {
    let gx = meX, gy = meY;
    const stepX = Math.cos(myAngle) * 12, stepY = Math.sin(myAngle) * 12;
    let steps = 0;
    while (steps < 130) {
      gx += stepX; gy += stepY; steps++;
      if (gx < 0 || gy < 0 || gx > world.w || gy > world.h) break;
      if (wallAt(gx, gy)) break;
    }
    ctx.strokeStyle = 'rgba(255,210,59,.5)'; ctx.lineWidth = 2; ctx.setLineDash([10, 8]);
    ctx.beginPath(); ctx.moveTo(meX - camX, meY - camY); ctx.lineTo(gx - camX, gy - camY); ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle = 'rgba(255,210,59,.8)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(gx - camX, gy - camY, 6, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(gx - camX - 9, gy - camY); ctx.lineTo(gx - camX + 9, gy - camY);
    ctx.moveTo(gx - camX, gy - camY - 9); ctx.lineTo(gx - camX, gy - camY + 9); ctx.stroke();
  }

  // ---- paredes gamificadas (bloco 3D com topo neon) ----
  for (const wl of gameMap.walls) {
    const x = wl.x - camX, y = wl.y - camY;
    // sombra projetada
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(x + 6, y + 6, wl.w, wl.h);
    // corpo
    ctx.fillStyle = '#3a3a4e'; ctx.fillRect(x, y, wl.w, wl.h);
    // topo iluminado
    ctx.fillStyle = '#565673'; ctx.fillRect(x, y, wl.w, 8);
    // linha neon na borda superior
    ctx.strokeStyle = 'rgba(120,180,255,.5)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + wl.w, y); ctx.stroke();
    // contorno
    ctx.strokeStyle = '#22222e'; ctx.lineWidth = 2; ctx.strokeRect(x, y, wl.w, wl.h);
  }

  // borda do mundo
  ctx.strokeStyle = '#ff3b52'; ctx.lineWidth = 5; ctx.strokeRect(-camX, -camY, world.w, world.h);

  // muzzle flash
  for (let i = muzzles.length - 1; i >= 0; i--) {
    const m2 = muzzles[i]; m2.life -= 0.2;
    if (m2.life <= 0) { muzzles.splice(i, 1); continue; }
    const fx = m2.x + Math.cos(m2.angle) * 28 - camX, fy = m2.y + Math.sin(m2.angle) * 28 - camY;
    ctx.fillStyle = `rgba(255,220,120,${m2.life})`;
    ctx.beginPath(); ctx.arc(fx, fy, 8 * m2.life + 3, 0, Math.PI * 2); ctx.fill();
  }

  // ---- BALAS (visual próprio por arma) ----
  for (const b of state.bullets) {
    const bx = b.x - camX, by = b.y - camY, a = b.a || 0, wpn = b.w || 'chinelo';
    ctx.save(); ctx.translate(bx, by); ctx.rotate(a);
    if (wpn === 'espada') {
      // risco dourado longo e afiado
      const grad = ctx.createLinearGradient(-30, 0, 12, 0);
      grad.addColorStop(0, 'rgba(255,210,59,0)'); grad.addColorStop(1, 'rgba(255,240,150,.95)');
      ctx.strokeStyle = grad; ctx.lineWidth = 5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-30, 0); ctx.lineTo(12, 0); ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(12,0); ctx.lineTo(4,-4); ctx.lineTo(4,4); ctx.fill();
    } else if (wpn === 'coco') {
      // bolota marrom com "cheiro"
      ctx.fillStyle = '#6b4423'; ctx.beginPath(); ctx.arc(0,0,6,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#8a5a2b'; ctx.beginPath(); ctx.arc(-1.5,-1.5,3,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle = 'rgba(150,200,80,.5)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.arc(0,0,9+Math.sin(animTime*20)*2,0,Math.PI*2); ctx.stroke();
    } else if (wpn === 'escova') {
      // tracinho rápido rosa/vermelho
      ctx.strokeStyle = 'rgba(255,90,120,.9)'; ctx.lineWidth = 3; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(-14,0); ctx.lineTo(4,0); ctx.stroke();
    } else {
      // chinelo girando
      ctx.rotate(animTime * 25);
      ctx.fillStyle = '#ff5fa2';
      roundRect(-7, -4, 14, 8, 4); ctx.fill();
      ctx.strokeStyle = '#c02f6e'; ctx.lineWidth = 1.5; roundRect(-7,-4,14,8,4); ctx.stroke();
      ctx.fillStyle = '#c02f6e'; ctx.beginPath(); ctx.arc(0,0,1.6,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  // ---- aura super sayajin (desenhada sob os jogadores) ----
  for (let i = auras.length - 1; i >= 0; i--) {
    const au = auras[i]; au.life -= 0.02;
    if (au.life <= 0) { auras.splice(i, 1); continue; }
    const rp = render[au.id]; if (!rp) continue;
    const ax = rp.x - camX, ay = rp.y - camY;
    const pulse = 30 + Math.sin(animTime * 20) * 6;
    // halo dourado
    const g = ctx.createRadialGradient(ax, ay, 5, ax, ay, pulse + 20);
    g.addColorStop(0, `rgba(255,230,120,${0.5 * au.life})`);
    g.addColorStop(0.6, `rgba(255,180,40,${0.3 * au.life})`);
    g.addColorStop(1, 'rgba(255,180,40,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(ax, ay, pulse + 20, 0, Math.PI * 2); ctx.fill();
    // labaredas subindo
    for (let f = 0; f < 8; f++) {
      const fa = (f / 8) * Math.PI * 2 + animTime * 3;
      const fr = pulse + Math.sin(animTime * 25 + f) * 8;
      const fx = ax + Math.cos(fa) * fr, fy = ay + Math.sin(fa) * fr - 6;
      ctx.fillStyle = `rgba(255,${200 + Math.floor(Math.random()*55)},60,${0.6 * au.life})`;
      ctx.beginPath(); ctx.moveTo(fx, fy);
      ctx.lineTo(fx - 5, fy + 14); ctx.lineTo(fx + 5, fy + 14); ctx.closePath(); ctx.fill();
    }
  }

  // ---- jogadores (posição interpolada) ----
  for (const p of state.players) {
    if (!p.alive) continue;
    const rp = render[p.id] || { x: p.x, y: p.y };
    const pv = prevPos[p.id];
    p.moving = pv ? (Math.abs(pv.x - rp.x) > 0.4 || Math.abs(pv.y - rp.y) > 0.4) : false;
    prevPos[p.id] = { x: rp.x, y: rp.y };
    drawBean(rp.x - camX, rp.y - camY, p, p.id === myId);
  }

  // partículas
  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.15; pt.vx *= 0.96; pt.life -= 0.03;
    if (pt.life <= 0) { particles.splice(i, 1); continue; }
    ctx.fillStyle = pt.type === 'blood' ? `rgba(200,20,30,${pt.life})` : `rgba(255,220,120,${pt.life})`;
    ctx.beginPath(); ctx.arc(pt.x - camX, pt.y - camY, pt.r * pt.life, 0, Math.PI * 2); ctx.fill();
  }

  // reset da transform para o HUD (já é DOM, mas garante estado limpo)
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  const sorted = [...state.players].sort((a, b) => b.kills - a.kills).slice(0, 5);
  document.getElementById('scoreboard').innerHTML =
    sorted.map(p => `${p.id === myId ? '▶ ' : ''}${p.name}: ${p.kills}💀`).join('<br>') || 'Placar';
  document.getElementById('status').innerHTML = me
    ? `HP: ${Math.max(0, me.hp)}<br>Kills: ${me.kills}<br><b>💰 ${me.points} pts</b>` : 'Conectando...';
  document.getElementById('dead').style.display = (me && !me.alive) ? 'flex' : 'none';

  requestAnimationFrame(draw);
}

// checagem de parede no cliente (para a linha de mira)
function wallAt(x, y) {
  for (const wl of gameMap.walls) {
    if (x > wl.x && x < wl.x + wl.w && y > wl.y && y < wl.y + wl.h) return true;
  }
  return false;
}
draw();
</script>
