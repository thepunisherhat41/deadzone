<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>DEADZONE</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; -webkit-user-select: none; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a1f; font-family: system-ui, sans-serif; }
  #game { display: block; background: #24242c; }

  /* Tela inicial */
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
           background: #1a1a1f; z-index: 20; gap: 16px; }
  #start h1 { color: #fff; font-size: 28px; }
  #start input { padding: 12px 16px; font-size: 16px; border-radius: 8px; border: none; width: 200px; text-align: center; }
  #start button { padding: 14px 32px; font-size: 18px; border: none; border-radius: 8px; background: #e04848; color: #fff; font-weight: bold; }

  /* HUD */
  #hud { position: fixed; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between;
         color: #fff; font-size: 13px; z-index: 10; pointer-events: none; }
  #scoreboard { background: rgba(0,0,0,.5); padding: 8px 12px; border-radius: 8px; line-height: 1.5; }
  #status { background: rgba(0,0,0,.5); padding: 8px 12px; border-radius: 8px; text-align: right; }

  /* Joystick */
  #stick { position: fixed; bottom: 30px; left: 30px; width: 120px; height: 120px; z-index: 10; }
  #stickBase { position: absolute; inset: 0; border-radius: 50%; background: rgba(255,255,255,.12); }
  #stickKnob { position: absolute; width: 54px; height: 54px; left: 33px; top: 33px; border-radius: 50%; background: rgba(255,255,255,.35); }

  /* Botões de ação */
  #actions { position: fixed; bottom: 30px; right: 30px; z-index: 10; display: flex; flex-direction: column; gap: 12px; align-items: center; }
  #fire { width: 90px; height: 90px; border-radius: 50%; background: rgba(224,72,72,.75); border: none; color: #fff; font-size: 16px; font-weight: bold; }
  #weapons { display: flex; gap: 8px; }
  .wbtn { padding: 10px 12px; border-radius: 8px; border: 2px solid transparent; background: rgba(255,255,255,.15); color: #fff; font-size: 13px; }
  .wbtn.active { border-color: #e0c848; background: rgba(224,200,72,.25); }

  #dead { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
          background: rgba(0,0,0,.6); color: #fff; font-size: 32px; z-index: 15; flex-direction: column; gap: 8px; }
  #dead small { font-size: 16px; opacity: .8; }
</style>
</head>
<body>

<div id="start">
  <h1>💀 DEADZONE</h1>
  <input id="nameInput" maxlength="12" placeholder="Seu nome" value="">
  <button id="playBtn">JOGAR</button>
</div>

<canvas id="game"></canvas>

<div id="hud">
  <div id="scoreboard">Placar</div>
  <div id="status">HP</div>
</div>

<div id="stick">
  <div id="stickBase"></div>
  <div id="stickKnob"></div>
</div>

<div id="actions">
  <div id="weapons">
    <button class="wbtn active" data-w="pistol">Pistola</button>
    <button class="wbtn" data-w="rifle">Rifle</button>
    <button class="wbtn" data-w="knife">Faca</button>
  </div>
  <button id="fire">🔫</button>
</div>

<div id="dead">☠️ Você morreu<small>respawn em instantes...</small></div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize); resize();

// ---- Estado ----
let ws, myId = null, world = { w: 1600, h: 1200 }, weapons = {};
let state = { players: [], bullets: [] };
let myAngle = 0;
const input = { up: false, down: false, left: false, right: false };
let currentWeapon = 'pistol';

// ---- Conexão ----
function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}`);
  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === 'init') {
      myId = msg.id; world = msg.world; weapons = msg.weapons;
    } else if (msg.type === 'state') {
      state = msg;
    }
  };
  ws.onclose = () => setTimeout(connect, 1000);
}

function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

// ---- Tela inicial ----
document.getElementById('playBtn').onclick = () => {
  const name = document.getElementById('nameInput').value.trim() || 'Player';
  connect();
  const wait = setInterval(() => {
    if (myId !== null) { clearInterval(wait); send({ type: 'setName', name }); }
  }, 100);
  document.getElementById('start').style.display = 'none';
};

// ---- Joystick ----
const stick = document.getElementById('stick');
const knob = document.getElementById('stickKnob');
let stickActive = false, stickId = null;
const stickCenter = { x: 60, y: 60 }, maxDist = 45;

stick.addEventListener('touchstart', (e) => { stickActive = true; stickId = e.changedTouches[0].identifier; e.preventDefault(); });
stick.addEventListener('touchmove', (e) => {
  for (const t of e.changedTouches) {
    if (t.identifier !== stickId) continue;
    const rect = stick.getBoundingClientRect();
    let dx = t.clientX - rect.left - stickCenter.x;
    let dy = t.clientY - rect.top - stickCenter.y;
    const d = Math.hypot(dx, dy);
    if (d > maxDist) { dx = dx / d * maxDist; dy = dy / d * maxDist; }
    knob.style.left = (33 + dx) + 'px';
    knob.style.top = (33 + dy) + 'px';
    const dead = 12;
    input.left = dx < -dead; input.right = dx > dead;
    input.up = dy < -dead; input.down = dy > dead;
    if (d > dead) myAngle = Math.atan2(dy, dx);
  }
  e.preventDefault();
});
function stickEnd(e) {
  stickActive = false; stickId = null;
  knob.style.left = '33px'; knob.style.top = '33px';
  input.up = input.down = input.left = input.right = false;
}
stick.addEventListener('touchend', stickEnd);
stick.addEventListener('touchcancel', stickEnd);

// ---- Botão de tiro ----
const fireBtn = document.getElementById('fire');
let firing = false, fireInterval = null;
function startFire(e) { firing = true; send({ type: 'attack' }); fireInterval = setInterval(() => send({ type: 'attack' }), 100); e.preventDefault(); }
function stopFire(e) { firing = false; clearInterval(fireInterval); if (e) e.preventDefault(); }
fireBtn.addEventListener('touchstart', startFire);
fireBtn.addEventListener('touchend', stopFire);
fireBtn.addEventListener('mousedown', startFire);
fireBtn.addEventListener('mouseup', stopFire);

// ---- Troca de arma ----
document.querySelectorAll('.wbtn').forEach(btn => {
  btn.addEventListener('touchstart', (e) => {
    document.querySelectorAll('.wbtn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentWeapon = btn.dataset.w;
    send({ type: 'switchWeapon', weapon: currentWeapon });
    e.preventDefault();
  });
  btn.addEventListener('click', () => {
    document.querySelectorAll('.wbtn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentWeapon = btn.dataset.w;
    send({ type: 'switchWeapon', weapon: currentWeapon });
  });
});

// ---- Teclado (desktop, para testar) ----
window.addEventListener('keydown', (e) => {
  if (e.key === 'w' || e.key === 'ArrowUp') input.up = true;
  if (e.key === 's' || e.key === 'ArrowDown') input.down = true;
  if (e.key === 'a' || e.key === 'ArrowLeft') input.left = true;
  if (e.key === 'd' || e.key === 'ArrowRight') input.right = true;
  if (e.key === ' ') send({ type: 'attack' });
});
window.addEventListener('keyup', (e) => {
  if (e.key === 'w' || e.key === 'ArrowUp') input.up = false;
  if (e.key === 's' || e.key === 'ArrowDown') input.down = false;
  if (e.key === 'a' || e.key === 'ArrowLeft') input.left = false;
  if (e.key === 'd' || e.key === 'ArrowRight') input.right = false;
});
window.addEventListener('mousemove', (e) => {
  const me = state.players.find(p => p.id === myId);
  if (me) myAngle = Math.atan2(e.clientY - H / 2, e.clientX - W / 2);
});

// ---- Envio de input (20x/s) ----
setInterval(() => { if (myId !== null) send({ type: 'input', input, angle: myAngle }); }, 50);

// ---- Render ----
function draw() {
  ctx.fillStyle = '#24242c';
  ctx.fillRect(0, 0, W, H);

  const me = state.players.find(p => p.id === myId);
  const camX = me ? me.x - W / 2 : 0;
  const camY = me ? me.y - H / 2 : 0;

  // Grade + bordas do mundo
  ctx.strokeStyle = '#33333d';
  ctx.lineWidth = 1;
  for (let x = 0; x <= world.w; x += 80) { ctx.beginPath(); ctx.moveTo(x - camX, -camY); ctx.lineTo(x - camX, world.h - camY); ctx.stroke(); }
  for (let y = 0; y <= world.h; y += 80) { ctx.beginPath(); ctx.moveTo(-camX, y - camY); ctx.lineTo(world.w - camX, y - camY); ctx.stroke(); }
  ctx.strokeStyle = '#e04848'; ctx.lineWidth = 3;
  ctx.strokeRect(-camX, -camY, world.w, world.h);

  // Projéteis
  ctx.fillStyle = '#ffe08a';
  for (const b of state.bullets) {
    ctx.beginPath(); ctx.arc(b.x - camX, b.y - camY, 4, 0, Math.PI * 2); ctx.fill();
  }

  // Jogadores
  for (const p of state.players) {
    if (!p.alive) continue;
    const sx = p.x - camX, sy = p.y - camY;

    // corpo
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(sx, sy, 18, 0, Math.PI * 2); ctx.fill();
    // direção da arma
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(sx, sy);
    ctx.lineTo(sx + Math.cos(p.angle) * 26, sy + Math.sin(p.angle) * 26); ctx.stroke();
    // contorno se for você
    if (p.id === myId) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(sx, sy, 21, 0, Math.PI * 2); ctx.stroke(); }

    // nome + barra de HP
    ctx.fillStyle = '#fff'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(p.name, sx, sy - 28);
    ctx.fillStyle = '#000'; ctx.fillRect(sx - 20, sy - 24, 40, 5);
    ctx.fillStyle = p.hp > 50 ? '#4caf50' : (p.hp > 25 ? '#ff9800' : '#f44336');
    ctx.fillRect(sx - 20, sy - 24, 40 * (p.hp / 100), 5);
  }

  // HUD
  const sorted = [...state.players].sort((a, b) => b.kills - a.kills).slice(0, 5);
  document.getElementById('scoreboard').innerHTML =
    sorted.map(p => `${p.name}: ${p.kills}💀 / ${p.deaths}☠️`).join('<br>') || 'Placar';
  document.getElementById('status').innerHTML = me
    ? `HP: ${Math.max(0, me.hp)}<br>Kills: ${me.kills}` : 'Conectando...';

  // Tela de morte
  document.getElementById('dead').style.display = (me && !me.alive) ? 'flex' : 'none';

  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
