name: Build DEADZONE beta mobile

on:
  push:
    branches:
      - beta-mobile-rework
    paths:
      - '.beta-builder/**'
      - '.github/workflows/build-beta-mobile.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare exact historical baselines
        shell: bash
        run: |
          set -euo pipefail
          DATA="$RUNNER_TEMP/dzdata"
          mkdir -p "$DATA/deadzone_update_v5/public" "$DATA/deadzone_beta_v6/public" "$DATA/v4_original_exact"
          git show 323b0b35bc80b54c4595ff07e477aae5f1050e97:server.js > "$DATA/deadzone_update_v5/server.js"
          git show 323b0b35bc80b54c4595ff07e477aae5f1050e97:public/index.html > "$DATA/deadzone_update_v5/public/index.html"
          git show 980faf7cb2bd6ed4ac2586cb3a65ec69c228cd4b:server.js > "$DATA/deadzone_beta_v6/server.js"
          git show eae1ddb0e881b71d88427906cf05a6f79e4dcaed:package.json > "$DATA/v4_original_exact/package.json"

      - name: Decode deterministic builder
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .beta-builder/build.py.gz.b64 | gzip -d > "$RUNNER_TEMP/build_deadzone.py"
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'build_deadzone.py'
          data = p.read_text()
          data = data.replace('/mnt/data', str(Path(os.environ['RUNNER_TEMP']) / 'dzdata'))
          p.write_text(data)
          PY
          python3 "$RUNNER_TEMP/build_deadzone.py"

      - name: Validate exact tested output
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/dzdata/deadzone_v4_mobile_beta_2"
          test "$(sha256sum "$OUT/server.js" | awk '{print $1}')" = "1b236cb14f1c583290f5ec375f093a96a0711adcf0c7339bec2928401063c743"
          test "$(sha256sum "$OUT/public/index.html" | awk '{print $1}')" = "5383f657866d9edce21065838d2823c44168bc22d754d0b11df5be96f74db99e"
          test "$(sha256sum "$OUT/package.json" | awk '{print $1}')" = "2207f0a1dc745cee58e21f1a84e4440f6ebd7daee9f140ff0f698bc3024f6831"
          node --check "$OUT/server.js"
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          out = Path(os.environ['RUNNER_TEMP']) / 'dzdata/deadzone_v4_mobile_beta_2'
          html = (out / 'public/index.html').read_text()
          js = re.search(r'<script>([\s\S]*)</script>', html).group(1)
          p = Path(os.environ['RUNNER_TEMP']) / 'client.js'
          p.write_text(js)
          PY
          node --check "$RUNNER_TEMP/client.js"

      - name: Install generated game files
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/dzdata/deadzone_v4_mobile_beta_2"
          cp "$OUT/server.js" server.js
          cp "$OUT/public/index.html" public/index.html
          cp "$OUT/package.json" package.json
          rm -rf .beta-builder
          rm -f .github/workflows/build-beta-mobile.yml

      - name: Commit validated beta to development branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build V4 mobile beta rework [skip ci]"
          git push origin HEAD:beta-mobile-rework
