name: Mobile weapon drawer rollout
on:
  push:
    branches: [feature-weapon-drawer-v1]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-weapon-drawer-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply and validate drawer patch
        run: python3 .github/scripts/weapon_drawer_patch.py
      - name: Commit compact weapon drawer
        shell: bash
        run: |
          rm -f .github/workflows/weapon-drawer-rollout.yml .github/scripts/weapon_drawer_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html .github/workflows/weapon-drawer-rollout.yml .github/scripts/weapon_drawer_patch.py
          git commit -m 'Add expandable mobile weapon shortcut [skip ci]'
          git push origin HEAD:feature-weapon-drawer-v1
