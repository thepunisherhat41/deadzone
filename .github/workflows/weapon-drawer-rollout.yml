name: Mobile weapon drawer rollout
on:
  push:
    branches:
      - feature-weapon-drawer-v1
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-weapon-drawer-v1
          fetch-depth: 0
      - name: Patch compact weapon drawer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          h=p.read_text()

          # Base quick-access button exists only on mobile/coarse pointers.
          marker="  #weapons { position: fixed; bottom: 194px; right: 30px; z-index: 10; display: flex; gap: 7px; flex-wrap: wrap; justify-content: flex-end; max-width: 360px; transition: opacity .2s; }\n"
          assert marker in h
          h=h.replace(marker, marker+"  #weaponQuick { display:none; }\n", 1)

          # Add compact shortcut before the existing weapon container.
          old='<div id="weapons"></div>\n<button id="bombBtn"'
          assert old in h
          new='''<button id="weaponQuick" type="button" aria-expanded="false" aria-label="Abrir armas">
  <span class="weaponIcon" id="weaponQuickIcon"></span>
  <span id="weaponQuickName">Arma</span>
  <span id="weaponQuickCaret">⌃</span>
</button>
<div id="weapons"></div>
<button id="bombBtn"'''
          h=h.replace(old,new,1)

          # Final mobile override. Keeps desktop behavior untouched.
          css_marker="  @media (max-width:370px){#scoreboard{width:94px;max-width:94px;font-size:8.2px}.wbtn{flex-basis:67px;width:67px}.hudPill{padding:3px 5px;font-size:8.4px}#status{font-size:8.5px}}\n"
          assert css_marker in h
          drawer_css=r'''  @media (max-width:820px),(pointer:coarse){
    #weaponQuick{position:fixed;left:50%;bottom:126px;transform:translateX(-50%);z-index:17;display:flex;align-items:center;gap:8px;width:min(228px,58vw);height:48px;padding:5px 10px 5px 7px;border-radius:14px;border:1px solid rgba(255,210,59,.34);background:linear-gradient(180deg,rgba(18,21,30,.96),rgba(8,10,16,.96));color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.36),inset 0 1px 0 rgba(255,255,255,.05);touch-action:manipulation;transition:transform .14s ease,border-color .14s ease,background .14s ease}
    #weaponQuick:active{transform:translateX(-50%) scale(.97)}#weaponQuick .weaponIcon{width:31px;height:31px;flex:0 0 31px}#weaponQuickName{min-width:0;flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;font-weight:950}#weaponQuickCaret{font-size:16px;color:#ffd23b;font-weight:1000;transition:transform .16s ease}#weaponQuick.open{border-color:#ffd23b;background:linear-gradient(180deg,rgba(50,42,15,.97),rgba(17,14,7,.97))}#weaponQuick.open #weaponQuickCaret{transform:rotate(180deg)}
    #weapons{left:50%;right:auto;bottom:182px;width:min(344px,calc(100vw - 20px));max-width:344px;max-height:min(228px,36vh);padding:7px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;overflow-x:hidden;overflow-y:auto;scrollbar-width:none;touch-action:pan-y;background:rgba(7,9,15,.96);border:1px solid rgba(255,255,255,.1);border-radius:15px;box-shadow:0 15px 38px rgba(0,0,0,.46);opacity:0;visibility:hidden;pointer-events:none;transform:translate(-50%,10px) scale(.97);transform-origin:bottom center;transition:opacity .14s ease,transform .14s ease,visibility .14s ease;z-index:16}
    #weapons::-webkit-scrollbar{display:none}#weapons.weaponDrawerOpen{opacity:1;visibility:visible;pointer-events:auto;transform:translate(-50%,0) scale(1)}
    #weapons .wbtn{width:auto;min-width:0;height:62px;min-height:62px;padding:5px 4px;display:flex;flex-direction:column;justify-content:center;gap:3px;border-radius:11px;scroll-snap-align:none}#weapons .wbtn .weaponIcon{width:30px;height:30px;flex:0 0 30px}#weapons .wbtn .wname{display:block!important;width:100%;font-size:8.5px;line-height:1.03;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#weapons .wbtn.locked{display:none}
    body.spectating #weaponQuick{opacity:.18;pointer-events:none}
  }
  @media (max-width:370px){#weaponQuick{width:min(214px,60vw);bottom:122px;height:46px}#weapons{bottom:176px;width:calc(100vw - 16px);grid-template-columns:repeat(3,minmax(0,1fr))}}
'''
          h=h.replace(css_marker, drawer_css+css_marker, 1)

          # JS drawer helpers after aim weapon icon helper.
          marker="function setAimWeaponIcon(key) {\n  if (key === lastAimWeaponIconKey) return;\n  const el = document.getElementById('aimWeaponIcon');\n  if (el) { el.innerHTML = weaponIconSvg(key); lastAimWeaponIconKey = key; }\n}\n\n"
          assert marker in h
          helpers=r'''let weaponDrawerOpen = false;
function updateWeaponQuick() {
  const btn = document.getElementById('weaponQuick');
  const icon = document.getElementById('weaponQuickIcon');
  const name = document.getElementById('weaponQuickName');
  const w = weapons[currentWeapon];
  if (!btn || !icon || !name || !w) return;
  icon.innerHTML = weaponIconSvg(currentWeapon);
  name.textContent = w.name;
  btn.title = `Armas • atual: ${w.name}`;
}
function setWeaponDrawer(open) {
  const bar = document.getElementById('weapons');
  const btn = document.getElementById('weaponQuick');
  if (!bar || !btn) return;
  weaponDrawerOpen = !!open;
  bar.classList.toggle('weaponDrawerOpen', weaponDrawerOpen);
  btn.classList.toggle('open', weaponDrawerOpen);
  btn.setAttribute('aria-expanded', weaponDrawerOpen ? 'true' : 'false');
  btn.setAttribute('aria-label', weaponDrawerOpen ? 'Fechar armas' : 'Abrir armas');
}
function toggleWeaponDrawer() { setWeaponDrawer(!weaponDrawerOpen); }
const weaponQuickBtn = document.getElementById('weaponQuick');
if (weaponQuickBtn) weaponQuickBtn.addEventListener('click', e => { e.stopPropagation(); toggleWeaponDrawer(); });
document.addEventListener('pointerdown', e => {
  if (!weaponDrawerOpen) return;
  const bar = document.getElementById('weapons'), btn = document.getElementById('weaponQuick');
  if ((bar && bar.contains(e.target)) || (btn && btn.contains(e.target))) return;
  setWeaponDrawer(false);
}, { passive:true });

'''
          h=h.replace(marker,marker+helpers,1)

          # Selecting a weapon closes the drawer immediately.
          old="      setAimWeaponIcon(key);\n    };\n"
          assert old in h
          h=h.replace(old,"      setAimWeaponIcon(key);\n      setWeaponDrawer(false);\n    };\n",1)

          # Quick shortcut always mirrors the equipped weapon.
          marker="    btn.classList.toggle('locked', !myData.owned[k]);\n  });\n}\n\n// ---- Loja ----\n"
          assert marker in h
          h=h.replace(marker,"    btn.classList.toggle('locked', !myData.owned[k]);\n  });\n  updateWeaponQuick();\n}\n\n// ---- Loja ----\n",1)

          # Close drawer before opening shop, so overlays never stack.
          old="function openShop(){document.getElementById('shop').style.display='flex';"
          assert old in h
          h=h.replace(old,"function openShop(){setWeaponDrawer(false);document.getElementById('shop').style.display='flex';",1)

          # Close when controls are paused/backgrounded.
          marker="function pauseLocalControls()"
          if marker in h:
            h=h.replace(marker,"function pauseLocalControls()",1)

          p.write_text(h)
          PY
      - name: Validate client syntax and drawer structure
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          h=Path('public/index.html').read_text()
          m=re.search(r'<script>(.*)</script>',h,re.S)
          assert m
          Path('/tmp/client.js').write_text(m.group(1))
          subprocess.run(['node','--check','/tmp/client.js'],check=True)
          checks=[
            'id="weaponQuick"',
            'weaponDrawerOpen',
            'function setWeaponDrawer(open)',
            'function updateWeaponQuick()',
            'grid-template-columns:repeat(3,minmax(0,1fr))',
            'setWeaponDrawer(false);'
          ]
          for c in checks: assert c in h, c
          print('mobile weapon drawer PASS')
          PY
      - name: Commit compact weapon drawer
        shell: bash
        run: |
          rm -f .github/workflows/weapon-drawer-rollout.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html .github/workflows/weapon-drawer-rollout.yml
          git commit -m 'Add expandable mobile weapon shortcut [skip ci]'
          git push origin HEAD:feature-weapon-drawer-v1
