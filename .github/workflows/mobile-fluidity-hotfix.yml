name: Mobile fluidity hotfix
on:
  push:
    branches: [hotfix-mobile-fluidity]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix-mobile-fluidity
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply hotfix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text()
          s=s.replace("const canvas = document.getElementById('game');\nconst ctx = canvas.getContext('2d');\nlet W, H, DPR = 1;\nfunction resize() {\n  const coarse=window.matchMedia&&window.matchMedia('(pointer: coarse)').matches;\n  DPR=Math.min(window.devicePixelRatio||1,coarse?1.5:2);", "const canvas = document.getElementById('game');\nconst ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });\nconst COARSE_POINTER = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);\nlet W, H, DPR = 1;\nfunction resize() {\n  DPR=Math.min(window.devicePixelRatio||1,COARSE_POINTER?1.5:2);")
          s=s.replace("  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; user-select: none; }", "  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }")
          s=s.replace("  #stickKnob { position: absolute; width: 58px; height: 58px; left: 36px; top: 36px; border-radius: 50%;", "  #stickKnob { position: absolute; width: 58px; height: 58px; left: 36px; top: 36px; border-radius: 50%; will-change: transform; transform: translate3d(0,0,0);")
          s=s.replace("  #aimKnob { position: absolute; width: 74px; height: 74px; left: 38px; top: 38px; border-radius: 50%;", "  #aimKnob { position: absolute; width: 74px; height: 74px; left: 38px; top: 38px; border-radius: 50%; will-change: transform; transform: translate3d(0,0,0);")
          s=s.replace("function setAimWeaponIcon(key) {\n  const el = document.getElementById('aimWeaponIcon');\n  if (el) el.innerHTML = weaponIconSvg(key);\n}", "let lastAimWeaponIconKey = null;\nfunction setAimWeaponIcon(key) {\n  if (key === lastAimWeaponIconKey) return;\n  const el = document.getElementById('aimWeaponIcon');\n  if (el) { el.innerHTML = weaponIconSvg(key); lastAimWeaponIconKey = key; }\n}")
          s=s.replace("function refreshWeaponBar() {\n  if (!myData) return;\n  document.querySelectorAll('#weapons .wbtn').forEach(btn => {\n    const k = btn.dataset.w;\n    btn.classList.toggle('active', k === currentWeapon && myData.owned[k]);\n    btn.classList.toggle('locked', !myData.owned[k]);\n  });\n}", "let lastWeaponBarSig = '';\nfunction refreshWeaponBar(force=false) {\n  if (!myData) return;\n  const owned = Object.keys(myData.owned || {}).filter(k => myData.owned[k]).sort().join(',');\n  const sig = `${currentWeapon}|${owned}`;\n  if (!force && sig === lastWeaponBarSig) return;\n  lastWeaponBarSig = sig;\n  document.querySelectorAll('#weapons .wbtn').forEach(btn => {\n    const k = btn.dataset.w;\n    btn.classList.toggle('active', k === currentWeapon && myData.owned[k]);\n    btn.classList.toggle('locked', !myData.owned[k]);\n  });\n}")
          s=s.replace("  refreshWeaponBar();\n}\nfunction refreshWeaponBar", "  lastWeaponBarSig = '';\n  refreshWeaponBar(true);\n}\nfunction refreshWeaponBar")
          s=s.replace("function refreshShop() {\n  if (!myData) return;\n  document.getElementById('shopPts').textContent = `Pontos: ${myData.points} • 🛡️ ${myData.armor || 0} • 🍾 ${myData.bombs || 0}`;", "let lastShopSig = '';\nfunction refreshShop(force=false) {\n  if (!myData) return;\n  const shopPanel = document.getElementById('shop');\n  if (!force && (!shopPanel || shopPanel.style.display !== 'flex')) return;\n  const owned = Object.keys(myData.owned || {}).filter(k => myData.owned[k]).sort().join(',');\n  const skinsOwned = Object.keys(myData.ownedSkins || {}).filter(k => myData.ownedSkins[k]).sort().join(',');\n  const sig = `${myData.points}|${myData.armor||0}|${myData.bombs||0}|${myData.skin||''}|${currentWeapon}|${owned}|${skinsOwned}`;\n  if (!force && sig === lastShopSig) return;\n  lastShopSig = sig;\n  document.getElementById('shopPts').textContent = `Pontos: ${myData.points} • 🛡️ ${myData.armor || 0} • 🍾 ${myData.bombs || 0}`;")
          s=s.replace("function openShop(){document.getElementById('shop').style.display='flex';const sc=document.getElementById('shopScroll');if(sc)sc.scrollTop=0;refreshShop()}", "function openShop(){document.getElementById('shop').style.display='flex';const sc=document.getElementById('shopScroll');if(sc)sc.scrollTop=0;lastShopSig='';refreshShop(true)}")
          s=s.replace("function pauseLocalControls(){input.up=input.down=input.left=input.right=false;try{stopAutoFire();aiming=false;centerJoystick(stick,knob);centerJoystick(aimStick,aimKnob)}catch{}send({type:'pause'})}", "function pauseLocalControls(){input.up=input.down=input.left=input.right=false;try{resetMobileControls(true)}catch{}send({type:'pause'})}")
          s=s.replace("  send({ type: 'useBomb' });", "  send({ type: 'useBomb', angle: myAngle });")
          a=s.index("// ---- Joysticks MOBILE: centro e alcance calculados pelo tamanho real renderizado ----")
          b=s.index("// ---- Desktop ----", a)
          block='''// ---- Joysticks MOBILE: Pointer Events + pointer capture para não "prender" ----
          const stick = document.getElementById('stick'), knob = document.getElementById('stickKnob');
          const aimStick = document.getElementById('aimStick'), aimKnob = document.getElementById('aimKnob');
          let stickId = null, aimId = null, aiming = false, fireTimer = null;
          const joyGeom = new WeakMap();
          let lastInputSentAt = 0, lastInputSig = '';
          function updateJoystickGeometry(base, handle) { const rect=base.getBoundingClientRect(),hw=handle.offsetWidth||50,hh=handle.offsetHeight||50;const g={left:rect.left,top:rect.top,centerX:rect.width/2,centerY:rect.height/2,hw,hh,maxDist:Math.max(20,Math.min(rect.width,rect.height)/2-Math.max(hw,hh)/2+2)};joyGeom.set(base,g);handle.style.left=(g.centerX-hw/2)+'px';handle.style.top=(g.centerY-hh/2)+'px';handle.style.transform='translate3d(0,0,0)';return g; }
          function joystickVector(base,handle,clientX,clientY){const g=joyGeom.get(base)||updateJoystickGeometry(base,handle);let dx=clientX-g.left-g.centerX,dy=clientY-g.top-g.centerY;const rawDist=Math.hypot(dx,dy);if(rawDist>g.maxDist&&rawDist>0){dx=dx/rawDist*g.maxDist;dy=dy/rawDist*g.maxDist}handle.style.transform=`translate3d(${dx.toFixed(1)}px,${dy.toFixed(1)}px,0)`;return{dx,dy,d:Math.hypot(dx,dy),maxDist:g.maxDist}}
          function centerJoystick(base,handle){if(!joyGeom.get(base))updateJoystickGeometry(base,handle);handle.style.transform='translate3d(0,0,0)'}
          function inputSignature(){return `${+input.up}${+input.down}${+input.left}${+input.right}|${Math.round(myAngle*100)}`}
          function sendInputSnapshot(force=false){if(myId===null)return;const now=performance.now(),sig=inputSignature();if(!force&&sig===lastInputSig&&now-lastInputSentAt<45)return;if(!force&&now-lastInputSentAt<24)return;lastInputSig=sig;lastInputSentAt=now;send({type:'input',input,angle:myAngle})}
          function setMoveFromVector(v){const dead=Math.max(7,v.maxDist*.21),before=`${+input.up}${+input.down}${+input.left}${+input.right}`;input.left=v.dx< -dead;input.right=v.dx>dead;input.up=v.dy< -dead;input.down=v.dy>dead;if(v.d>dead&&!aiming)myAngle=Math.atan2(v.dy,v.dx);const after=`${+input.up}${+input.down}${+input.left}${+input.right}`;sendInputSnapshot(before!==after)}
          function currentAutoFireDelay(){const w=weapons[currentWeapon];return Math.max(80,Math.min(950,((w&&w.cooldown)||300)+8))}
          function fireTick(){if(!canControlPlayer()||!aiming){stopAutoFire();return}send({type:'attack',angle:myAngle});fireTimer=setTimeout(fireTick,currentAutoFireDelay())}
          function startAutoFire(){if(!canControlPlayer()||fireTimer)return;fireTick()}
          function stopAutoFire(){if(fireTimer)clearTimeout(fireTimer);fireTimer=null}
          function setAimFromVector(v){const dead=Math.max(7,v.maxDist*.20);if(v.d>dead){myAngle=Math.atan2(v.dy,v.dx);sendInputSnapshot(false);startAutoFire()}else stopAutoFire()}
          function endStick(pointerId,force=false){if(!force&&stickId!==pointerId)return;stickId=null;centerJoystick(stick,knob);input.up=input.down=input.left=input.right=false;sendInputSnapshot(true)}
          function endAim(pointerId,force=false){if(!force&&aimId!==pointerId)return;aimId=null;aiming=false;centerJoystick(aimStick,aimKnob);stopAutoFire();sendInputSnapshot(true)}
          function resetMobileControls(force=false){const sid=stickId,aid=aimId;try{if(sid!==null&&stick.hasPointerCapture&&stick.hasPointerCapture(sid))stick.releasePointerCapture(sid)}catch{}try{if(aid!==null&&aimStick.hasPointerCapture&&aimStick.hasPointerCapture(aid))aimStick.releasePointerCapture(aid)}catch{}endStick(sid,true);endAim(aid,true);if(force){input.up=input.down=input.left=input.right=false;stopAutoFire()}}
          function onStickDown(e){if(!canControlPlayer()||stickId!==null)return;stickId=e.pointerId;updateJoystickGeometry(stick,knob);try{stick.setPointerCapture(e.pointerId)}catch{}setMoveFromVector(joystickVector(stick,knob,e.clientX,e.clientY));e.preventDefault()}
          function onStickMove(e){if(e.pointerId!==stickId)return;setMoveFromVector(joystickVector(stick,knob,e.clientX,e.clientY));e.preventDefault()}
          function onAimDown(e){if(!canControlPlayer()||aimId!==null)return;aimId=e.pointerId;aiming=true;updateJoystickGeometry(aimStick,aimKnob);try{aimStick.setPointerCapture(e.pointerId)}catch{}setAimFromVector(joystickVector(aimStick,aimKnob,e.clientX,e.clientY));e.preventDefault()}
          function onAimMove(e){if(e.pointerId!==aimId)return;setAimFromVector(joystickVector(aimStick,aimKnob,e.clientX,e.clientY));e.preventDefault()}
          if(window.PointerEvent){stick.addEventListener('pointerdown',onStickDown,{passive:false});stick.addEventListener('pointermove',onStickMove,{passive:false});stick.addEventListener('pointerup',e=>endStick(e.pointerId),{passive:false});stick.addEventListener('pointercancel',e=>endStick(e.pointerId),{passive:false});stick.addEventListener('lostpointercapture',e=>endStick(e.pointerId));aimStick.addEventListener('pointerdown',onAimDown,{passive:false});aimStick.addEventListener('pointermove',onAimMove,{passive:false});aimStick.addEventListener('pointerup',e=>endAim(e.pointerId),{passive:false});aimStick.addEventListener('pointercancel',e=>endAim(e.pointerId),{passive:false});aimStick.addEventListener('lostpointercapture',e=>endAim(e.pointerId))}else{stick.addEventListener('touchstart',e=>{const t=e.changedTouches[0];onStickDown({pointerId:t.identifier,clientX:t.clientX,clientY:t.clientY,preventDefault:()=>e.preventDefault()})},{passive:false});stick.addEventListener('touchmove',e=>{for(const t of e.changedTouches)if(t.identifier===stickId)onStickMove({pointerId:t.identifier,clientX:t.clientX,clientY:t.clientY,preventDefault:()=>e.preventDefault()})},{passive:false});stick.addEventListener('touchend',e=>{for(const t of e.changedTouches)endStick(t.identifier)},{passive:false});stick.addEventListener('touchcancel',e=>{for(const t of e.changedTouches)endStick(t.identifier)},{passive:false});aimStick.addEventListener('touchstart',e=>{const t=e.changedTouches[0];onAimDown({pointerId:t.identifier,clientX:t.clientX,clientY:t.clientY,preventDefault:()=>e.preventDefault()})},{passive:false});aimStick.addEventListener('touchmove',e=>{for(const t of e.changedTouches)if(t.identifier===aimId)onAimMove({pointerId:t.identifier,clientX:t.clientX,clientY:t.clientY,preventDefault:()=>e.preventDefault()})},{passive:false});aimStick.addEventListener('touchend',e=>{for(const t of e.changedTouches)endAim(t.identifier)},{passive:false});aimStick.addEventListener('touchcancel',e=>{for(const t of e.changedTouches)endAim(t.identifier)},{passive:false})}
          window.addEventListener('resize',()=>{joyGeom.delete(stick);joyGeom.delete(aimStick);if(stickId===null)updateJoystickGeometry(stick,knob);if(aimId===null)updateJoystickGeometry(aimStick,aimKnob)});
          
          '''
          s=s[:a]+block+s[b:]
          s=s.replace("window.addEventListener('mousedown', (e) => { if (e.target.closest('#vote,#shop,#topRight,#chatInputWrap,#start,#spectator')) return; startAutoFire(); });", "window.addEventListener('mousedown', (e) => { if (e.target.closest('#vote,#shop,#topRight,#chatInputWrap,#start,#spectator')) return; aiming = true; startAutoFire(); });")
          s=s.replace("window.addEventListener('mouseup', () => stopAutoFire());", "window.addEventListener('mouseup', () => { aiming = false; stopAutoFire(); });")
          s=s.replace("setInterval(() => { if (myId !== null) send({ type: 'input', input, angle: myAngle }); }, 50);", "setInterval(() => sendInputSnapshot(false), 1000 / 30);")
          s=s.replace("let animTime = 0;\nconst prevPos = {};", "let animTime = 0, lastFrameTs = performance.now();\nconst prevPos = {};")
          s=s.replace("function draw() {\n  animTime += 1 / 60;\n  const ZOOM = getGameZoom();\n\n  // ---- interpola posições (movimento fluido entre updates do servidor) ----\n  for (const id in render) {\n    const r = render[id];\n    if (r.tx !== undefined) { r.x += (r.tx - r.x) * 0.25; r.y += (r.ty - r.y) * 0.25; }\n  }", "function draw(frameTs = performance.now()) {\n  const dt = Math.max(0.001, Math.min(0.05, (frameTs - lastFrameTs) / 1000));\n  lastFrameTs = frameTs; animTime += dt;\n  const ZOOM = getGameZoom();\n  const interpAlpha = 1 - Math.exp(-16 * dt);\n\n  // ---- interpola posições com constante de tempo estável em 30/60/90/120 Hz ----\n  for (const id in render) {\n    const r = render[id];\n    if (r.tx !== undefined) { r.x += (r.tx - r.x) * interpAlpha; r.y += (r.ty - r.y) * interpAlpha; }\n  }")
          s=s.replace("  if (gameMap.rooms) for (const rm of gameMap.rooms) {\n    drawRoomFloor(rm,camX,camY);", "  if (gameMap.rooms) for (const rm of gameMap.rooms) {\n    if (rm.x + rm.w < camX - 60 || rm.y + rm.h < camY - 60 || rm.x > camX + viewW + 60 || rm.y > camY + viewH + 60) continue;\n    drawRoomFloor(rm,camX,camY);")
          s=s.replace("function spawnExplosion(x, y, radius) {\n  const count = 44;", "function spawnExplosion(x, y, radius) {\n  const count = COARSE_POINTER ? 30 : 44;")
          s=s.replace("  if(particles.length>260)particles.splice(0,particles.length-260);", "  const particleCap = COARSE_POINTER ? 150 : 260; if(particles.length>particleCap)particles.splice(0,particles.length-particleCap);")
          s=s.replace("  if (decals.length > 40) decals.splice(0, decals.length - 40);", "  const decalCap = COARSE_POINTER ? 28 : 40; if (decals.length > decalCap) decals.splice(0, decals.length - decalCap);")
          s=s.replace("    for (let f = 0; f < 8; f++) {\n      const fa = (f / 8) * Math.PI * 2 + animTime * 3;", "    const auraFlames = COARSE_POINTER ? 5 : 8;\n    for (let f = 0; f < auraFlames; f++) {\n      const fa = (f / auraFlames) * Math.PI * 2 + animTime * 3;")
          old="  const mobileHud=W<=820||(window.matchMedia&&window.matchMedia('(pointer: coarse)').matches),sorted=[...state.players].sort((a,b)=>b.kills-a.kills).slice(0,mobileHud?3:5);document.getElementById('scoreboard').innerHTML=sorted.length?`<span class=\"hudTitle\">TOP ${mobileHud?3:5}</span>`+sorted.map((p,i)=>`<div class=\"scoreLine${p.id===myId?' me':''}\"><span class=\"rank\">${i+1}</span><span class=\"name\">${p.id===myId?'▶ ':''}${escapeHtml(p.name)}${p.spectating?' 👁':''}</span><span>${p.kills}💀</span></div>`).join(''):'Placar';let timerStr='';if(state.timeLeft!=null&&state.phase==='playing'){const mm=Math.floor(state.timeLeft/60),ss=state.timeLeft%60;timerStr=`${mm}:${ss.toString().padStart(2,'0')}`}if(me){const weaponName=(weapons[me.weapon]&&weapons[me.weapon].name)||'Arma';document.getElementById('status').innerHTML=me.spectating?`<span class=\"hudTitle\">EXPECTADOR</span><div class=\"hudPills\"><span class=\"hudPill\">👁 Fora da rodada</span><span class=\"hudPill money\">💰 ${me.points}</span><span class=\"hudPill\">☠️ ${me.kills}</span></div>`:`<div class=\"hudPills\"><span class=\"hudPill hp\">❤️ ${Math.max(0,me.hp)}/${me.maxHp||100}</span>${me.armor>0?`<span class=\"hudPill\">🛡️ ${me.armor}</span>`:''}<span class=\"hudPill money\">💰 ${me.points}</span><span class=\"hudPill\">🍾 ${me.bombs||0}</span><span class=\"hudPill weapon\">🔫 ${escapeHtml(weaponName)}</span><span class=\"hudPill\">R${state.round||1}${timerStr?' • ⏱ '+timerStr:''}</span></div>`}else document.getElementById('status').textContent='Conectando...';\n"
          s=s.replace(old,"  updateHudDom(me, frameTs);\n")
          helper='''let lastHudPaintAt=0,lastScoreHtml='',lastStatusHtml='';
          function updateHudDom(me,nowTs=performance.now()){if(nowTs-lastHudPaintAt<90)return;lastHudPaintAt=nowTs;const mobileHud=W<=820||COARSE_POINTER,sorted=[...state.players].sort((a,b)=>b.kills-a.kills).slice(0,mobileHud?3:5);const scoreHtml=sorted.length?`<span class="hudTitle">TOP ${mobileHud?3:5}</span>`+sorted.map((p,i)=>`<div class="scoreLine${p.id===myId?' me':''}"><span class="rank">${i+1}</span><span class="name">${p.id===myId?'▶ ':''}${escapeHtml(p.name)}${p.spectating?' 👁':''}</span><span>${p.kills}💀</span></div>`).join(''):'Placar';if(scoreHtml!==lastScoreHtml){document.getElementById('scoreboard').innerHTML=scoreHtml;lastScoreHtml=scoreHtml}let timerStr='';if(state.timeLeft!=null&&state.phase==='playing'){const mm=Math.floor(state.timeLeft/60),ss=state.timeLeft%60;timerStr=`${mm}:${ss.toString().padStart(2,'0')}`}let statusHtml='Conectando...';if(me){const weaponName=(weapons[me.weapon]&&weapons[me.weapon].name)||'Arma';statusHtml=me.spectating?`<span class="hudTitle">EXPECTADOR</span><div class="hudPills"><span class="hudPill">👁 Fora da rodada</span><span class="hudPill money">💰 ${me.points}</span><span class="hudPill">☠️ ${me.kills}</span></div>`:`<div class="hudPills"><span class="hudPill hp">❤️ ${Math.max(0,me.hp)}/${me.maxHp||100}</span>${me.armor>0?`<span class="hudPill">🛡️ ${me.armor}</span>`:''}<span class="hudPill money">💰 ${me.points}</span><span class="hudPill">🍾 ${me.bombs||0}</span><span class="hudPill weapon">🔫 ${escapeHtml(weaponName)}</span><span class="hudPill">R${state.round||1}${timerStr?' • ⏱ '+timerStr:''}</span></div>`}if(statusHtml!==lastStatusHtml){document.getElementById('status').innerHTML=statusHtml;lastStatusHtml=statusHtml}}
          
          '''
          s=s.replace('function getGameZoom() {',helper+'function getGameZoom() {')
          s=s.replace("let myVote = null;\nfunction updateVoteUI() {\n  const panel = document.getElementById('vote');", "let myVote = null, lastVoteUiSig = '';\nfunction updateVoteUI() {\n  const votePlayersSig = state.players.map(p => `${p.id}:${p.kills}:${p.spectating?1:0}:${p.name}`).join(';');\n  const voteSig = `${state.phase}|${state.timeLeft}|${myVote}|${JSON.stringify(state.votes||{})}|${state.ejected?state.ejected.id||state.ejected.name||'x':''}|${votePlayersSig}`;\n  if (voteSig === lastVoteUiSig) return;\n  lastVoteUiSig = voteSig;\n  const panel = document.getElementById('vote');")
          s=s.replace("function updateSpectatorUI() {\n  const me = state.players.find(p => p.id === myId);\n  const active = !!me && !!me.spectating && state.phase === 'playing';", "let lastSpectatorUiSig = '';\nfunction updateSpectatorUI() {\n  const me = state.players.find(p => p.id === myId);\n  const active = !!me && !!me.spectating && state.phase === 'playing';\n  const targetPreview = active ? ensureSpectateTarget() : null;\n  const sig = `${active?1:0}|${targetPreview?targetPreview.id:''}|${targetPreview?targetPreview.kills:''}`;\n  if (sig === lastSpectatorUiSig) return;\n  lastSpectatorUiSig = sig;")
          s=s.replace("  const t = ensureSpectateTarget();\n  document.getElementById('spectatorTarget').textContent = t ? `${t.name} • ${t.kills} kills` : 'ninguém vivo no momento';", "  const t = targetPreview || ensureSpectateTarget();\n  document.getElementById('spectatorTarget').textContent = t ? `${t.name} • ${t.kills} kills` : 'ninguém vivo no momento';")
          p.write_text(s)
          q=Path('server.js');ss=q.read_text();ss=ss.replace("const BUILD = 'v4-mobile-beta-2.0';","const BUILD = 'v4-mobile-beta-2.1-fluid-controls';")
          ss=ss.replace("      case 'useBomb':\n        if (pl.alive && !isSpectating(pl) && phase === 'playing') throwBomb(pl, ws);\n        break;\n      case 'attack':\n        if (pl.alive && !isSpectating(pl) && phase === 'playing') tryAttack(pl);\n        break;", "      case 'useBomb':\n        if (pl.alive && !isSpectating(pl) && phase === 'playing') {\n          if (Number.isFinite(msg.angle)) pl.angle = Math.atan2(Math.sin(msg.angle), Math.cos(msg.angle));\n          throwBomb(pl, ws);\n        }\n        break;\n      case 'attack':\n        if (pl.alive && !isSpectating(pl) && phase === 'playing') {\n          if (Number.isFinite(msg.angle)) pl.angle = Math.atan2(Math.sin(msg.angle), Math.cos(msg.angle));\n          tryAttack(pl);\n        }\n        break;")
          q.write_text(ss)
          PY
      - name: Validate syntax and hotfix markers
        shell: bash
        run: |
          node --check server.js
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          s=Path('public/index.html').read_text();m=re.search(r'<script>(.*)</script>',s,re.S);assert m
          Path('/tmp/client.js').write_text(m.group(1));subprocess.run(['node','--check','/tmp/client.js'],check=True)
          checks=['setPointerCapture','lostpointercapture',"send({type:'attack',angle:myAngle})",'1000 / 30','lastHudPaintAt','lastAimWeaponIconKey','lastShopSig','lastVoteUiSig','interpAlpha = 1 - Math.exp(-16 * dt)','translate3d']
          missing=[x for x in checks if x not in s]
          if missing: raise SystemExit('missing: '+repr(missing))
          print('hotfix validation PASS')
          PY
      - name: Commit patched build
        shell: bash
        run: |
          rm -f .github/workflows/mobile-fluidity-hotfix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html server.js .github/workflows/mobile-fluidity-hotfix.yml
          git commit -m 'Fix sticky mobile controls and improve fluidity [skip ci]'
          git push origin HEAD:hotfix-mobile-fluidity
