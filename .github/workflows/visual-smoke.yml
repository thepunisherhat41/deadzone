name: Visual smoke
on:
  push:
    branches:
      - feature-graphics-overhaul-v1
permissions:
  contents: read
jobs:
  mobile-visual:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-graphics-overhaul-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install app
        run: npm install --no-audit --no-fund
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Start DEADZONE
        run: |
          PORT=3000 npm start > /tmp/deadzone.log 2>&1 &
          echo $! > /tmp/deadzone.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health >/tmp/health.json; then cat /tmp/health.json; exit 0; fi
            sleep 1
          done
          cat /tmp/deadzone.log
          exit 1
      - name: Run mobile and desktop render smoke
        shell: bash
        run: |
          mkdir -p visual-artifacts
          cat > visual-smoke.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const errors=[];
          async function run(name, viewport, isMobile){
            const context=await browser.newContext({viewport,isMobile,hasTouch:isMobile,deviceScaleFactor:isMobile?2:1});
            const page=await context.newPage();
            page.on('pageerror',e=>errors.push(`${name}: ${e.message}`));
            page.on('console',m=>{if(m.type()==='error')errors.push(`${name} console: ${m.text()}`)});
            await page.goto('http://127.0.0.1:3000',{waitUntil:'domcontentloaded'});
            await page.locator('#start input').fill(name.toUpperCase());
            await page.locator('#playBtn').click();
            await page.waitForFunction(()=>getComputedStyle(document.getElementById('start')).display==='none',{timeout:12000});
            await page.waitForTimeout(1600);
            const data=await page.evaluate(()=>({
              visual:window.DEADZONE_VISUAL_BUILD,
              canvas:{w:document.getElementById('game').width,h:document.getElementById('game').height},
              weaponQuick:getComputedStyle(document.getElementById('weaponQuick')).display,
              scoreboard:document.getElementById('scoreboard').textContent,
              bodyBg:getComputedStyle(document.body).backgroundColor
            }));
            if(data.visual!=='graphics-overhaul-v1')throw new Error(`${name}: visual marker missing`);
            if(!data.canvas.w||!data.canvas.h)throw new Error(`${name}: canvas empty`);
            if(isMobile&&data.weaponQuick==='none')throw new Error(`${name}: mobile weapon shortcut hidden`);
            await page.screenshot({path:`visual-artifacts/${name}.png`,fullPage:true});
            console.log(name,JSON.stringify(data));
            await context.close();
          }
          await run('mobile-390x844',{width:390,height:844},true);
          await run('desktop-1280x720',{width:1280,height:720},false);
          await browser.close();
          if(errors.length){console.error(errors.join('\n'));process.exit(1)}
          JS
          node visual-smoke.mjs
          rm -f visual-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deadzone-graphics-overhaul-screenshots
          path: visual-artifacts
          retention-days: 2
