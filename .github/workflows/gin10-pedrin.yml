name: Gin de 10 do Pedrin rollout
on:
  push:
    branches: [feature-gin10-pedrin]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-gin10-pedrin
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Add Gin de 10 do Pedrin
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          server=Path('server.js')
          html=Path('public/index.html')
          s=server.read_text()
          h=html.read_text()

          old="const BUILD = 'v4-mobile-beta-2.1-fluid-controls';"
          assert old in s
          s=s.replace(old, "const BUILD = 'v4-mobile-beta-2.2-gin10';", 1)

          needle="""  chinelo: {
            name: 'Chinelo', emoji: '🩴', icon: 'chinelo', cost: 0,
            damage: 24, cooldown: 320, speed: 15, range: 520, pellets: 1, hitRadius: 19,
            tint: '#ff5fa2', description: 'Arremesso médio, simples e confiável.'
          },
          """
          weapon=needle+"""  gin10: {
            name: 'Gin de 10 do Pedrin', emoji: '🥤', icon: 'gin10', cost: 0,
            damage: 12, cooldown: 420, speed: 17, range: 560, pellets: 1, hitRadius: 22,
            tint: '#ff2f68',
            description: 'Arma poderosa de um bêbado. Arremessa um copo de gin de 10: pouco dano, alcance médio e não atravessa paredes.'
          },
          """
          assert needle in s
          s=s.replace(needle,weapon,1)

          old="owned: { chinelo: true, grito: true },  // ambas grátis desde o início"
          assert old in s
          s=s.replace(old,"owned: { chinelo: true, gin10: true, grito: true },  // armas grátis desde o início",1)

          needle="""  ws.playerId = id;

            ws.send(JSON.stringify({ type: 'init', id, sessionToken: token, resumed, build: BUILD, world: WORLD, weapons: WEAPONS, utilities: UTILITIES, skins: SKINS, map: currentMap(), killReward: KILL_REWARD, phase, timeLeft: Math.max(0, Math.round((phaseEndsAt - Date.now()) / 1000)) }));
          """
          repl="""  ws.playerId = id;
            // Gin de 10 do Pedrin é arma gratuita: garante desbloqueio também em sessões retomadas.
            player.owned.gin10 = true;

            ws.send(JSON.stringify({ type: 'init', id, sessionToken: token, resumed, build: BUILD, world: WORLD, weapons: WEAPONS, utilities: UTILITIES, skins: SKINS, map: currentMap(), killReward: KILL_REWARD, phase, timeLeft: Math.max(0, Math.round((phaseEndsAt - Date.now()) / 1000)) }));
          """
          assert needle in s
          s=s.replace(needle,repl,1)
          server.write_text(s)

          needle="""  // chinelo: vento do arremesso + tapa seco
            chinelo: () => { noise(0.10, 0.07, 'highpass', 1400); setTimeout(()=>tone(150,0.06,'triangle',0.12,90),45); },
          """
          repl=needle+"""  // Gin de 10 do Pedrin: copo plástico, gelo e líquido chacoalhando
            gin10:   () => { noise(0.10,0.04,'bandpass',1300); tone(390,0.045,'triangle',0.055,250); setTimeout(()=>noise(0.09,0.035,'highpass',2100),45); },
          """
          assert needle in h
          h=h.replace(needle,repl,1)

          old="const WEAPON_ICON_KIND={chinelo:'chinelo',grito:'grito',escova:'escova',coco:'coco',espada:'espada',peido:'peido',lilika:'lilika',dracarys:'dracarys'};"
          assert old in h
          h=h.replace(old,"const WEAPON_ICON_KIND={chinelo:'chinelo',gin10:'gin10',grito:'grito',escova:'escova',coco:'coco',espada:'espada',peido:'peido',lilika:'lilika',dracarys:'dracarys'};",1)

          needle="""    </g></svg>`;
            if (key === 'grito') return open + `
          """
          icon="""    </g></svg>`;
            if (key === 'gin10') return open + `
              <g transform="rotate(-4 32 32)">
                <path d="M18 13h30l-3 42c-.3 4-3 6-7 6H28c-4 0-7-2-7-6z" fill="rgba(238,249,255,.42)" stroke="#d8f2ff" stroke-width="2.5"/>
                <path d="M21 30h24l-2 25c-.2 2-2 3-4 3H28c-2 0-4-1-4-3z" fill="#ff1759" opacity=".93"/>
                <path d="M22 28c6 3 15 3 22 0" fill="none" stroke="#ff79a3" stroke-width="2" opacity=".9"/>
                <g fill="rgba(255,255,255,.78)" stroke="rgba(188,222,240,.8)" stroke-width="1">
                  <rect x="25" y="19" width="8" height="7" rx="2" transform="rotate(-14 29 22.5)"/>
                  <rect x="35" y="18" width="8" height="8" rx="2" transform="rotate(12 39 22)"/>
                  <rect x="29" y="27" width="7" height="6" rx="2" transform="rotate(8 32.5 30)"/>
                </g>
                <path d="M43 5L35 37" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/>
                <path d="M17 12h32" stroke="#f3fbff" stroke-width="3" stroke-linecap="round"/>
                <rect x="27" y="39" width="12" height="7" rx="3.5" fill="rgba(20,15,20,.38)"/>
                <text x="33" y="44" text-anchor="middle" font-size="6" font-weight="900" fill="#fff">10</text>
              </g></svg>`;
            if (key === 'grito') return open + `
          """
          assert needle in h
          h=h.replace(needle,icon,1)

          needle="function drawHairBrushSprite(x, y, scale, rot) {\n"
          fn="""function drawGinCupSprite(x, y, scale, rot) {
            ctx.save(); ctx.translate(x,y); ctx.rotate(rot||0); ctx.scale(scale,scale);
            ctx.fillStyle='rgba(225,246,255,.28)'; ctx.strokeStyle='#d8f2ff'; ctx.lineWidth=1.7;
            ctx.beginPath(); ctx.moveTo(-10,-14); ctx.lineTo(10,-14); ctx.lineTo(8,14); ctx.quadraticCurveTo(0,17,-8,14); ctx.closePath(); ctx.fill(); ctx.stroke();
            ctx.fillStyle='rgba(255,23,89,.92)'; ctx.beginPath(); ctx.moveTo(-9,-1); ctx.lineTo(9,-1); ctx.lineTo(7.5,13); ctx.quadraticCurveTo(0,15,-7.5,13); ctx.closePath(); ctx.fill();
            ctx.strokeStyle='#ff86ad'; ctx.lineWidth=1.2; ctx.beginPath(); ctx.moveTo(-8,-2); ctx.quadraticCurveTo(0,1,8,-2); ctx.stroke();
            ctx.fillStyle='rgba(255,255,255,.72)'; ctx.strokeStyle='rgba(186,222,240,.75)'; ctx.lineWidth=.8;
            for(const [ix,iy,r] of [[-4,-7,-.14],[3,-8,.12],[0,-3,.08]]) { ctx.save();ctx.translate(ix,iy);ctx.rotate(r);roundRect(-3,-3,6,6,1.5);ctx.fill();ctx.stroke();ctx.restore(); }
            ctx.strokeStyle='#fff'; ctx.lineWidth=2.2; ctx.lineCap='round'; ctx.beginPath();ctx.moveTo(5,-18);ctx.lineTo(0,5);ctx.stroke();
            ctx.fillStyle='rgba(25,15,22,.45)'; roundRect(-5,5,10,6,3);ctx.fill(); ctx.fillStyle='#fff';ctx.font='900 5px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('10',0,8);
            ctx.restore();
          }
          function drawHairBrushSprite(x, y, scale, rot) {
          """
          assert needle in h
          h=h.replace(needle,fn,1)

          old="function drawHeldWeapon(key){if(key==='dracarys'){drawFlameSprite(20,0,.72,0)}else if (key === 'grito') {"
          assert old in h
          h=h.replace(old,"function drawHeldWeapon(key){if(key==='dracarys'){drawFlameSprite(20,0,.72,0)}else if(key==='gin10'){drawGinCupSprite(20,0,.72,-.08)}else if (key === 'grito') {",1)

          needle="""    } else if (wpn === 'espada') {
          """
          branch="""    } else if (wpn === 'gin10') {
              ctx.strokeStyle='rgba(255,47,104,.28)'; ctx.lineWidth=3; ctx.beginPath();ctx.moveTo(-26,0);ctx.lineTo(-10,0);ctx.stroke();
              ctx.rotate(animTime*11 + (b.x+b.y)*.012);
              drawGinCupSprite(0,0,.78,0);
              ctx.fillStyle='rgba(255,23,89,.42)'; ctx.beginPath();ctx.arc(-14,4,2.2,0,Math.PI*2);ctx.arc(-21,-2,1.6,0,Math.PI*2);ctx.fill();
            } else if (wpn === 'espada') {
          """
          assert needle in h
          h=h.replace(needle,branch,1)
          html.write_text(h)
          PY
      - name: Validate Gin de 10 build
        shell: bash
        run: |
          node --check server.js
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          server=Path('server.js').read_text()
          html=Path('public/index.html').read_text()
          m=re.search(r'<script>(.*)</script>',html,re.S); assert m
          Path('/tmp/client.js').write_text(m.group(1))
          subprocess.run(['node','--check','/tmp/client.js'],check=True)
          checks=[
            "name: 'Gin de 10 do Pedrin'", "icon: 'gin10', cost: 0", "damage: 12", "range: 560",
            "owned: { chinelo: true, gin10: true, grito: true }", "player.owned.gin10 = true",
            "gin10:'gin10'", 'function drawGinCupSprite', "wpn === 'gin10'", "key==='gin10'", 'gin10:   () =>',
            "if (!b.wave && hitsWall(b.x, b.y, 3))"
          ]
          joined=server+html
          missing=[x for x in checks if x not in joined]
          if missing: raise SystemExit('missing: '+repr(missing))
          gin_block=server.split("gin10: {",1)[1].split("},",1)[0]
          if 'wave: true' in gin_block or 'pierce: true' in gin_block: raise SystemExit('Gin de 10 must not pierce walls')
          print('Gin de 10 validation PASS')
          PY
      - name: Commit Gin de 10 build
        shell: bash
        run: |
          rm -f .github/workflows/gin10-pedrin.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js public/index.html .github/workflows/gin10-pedrin.yml
          git commit -m 'Add free Gin de 10 do Pedrin weapon [skip ci]'
          git push origin HEAD:feature-gin10-pedrin
